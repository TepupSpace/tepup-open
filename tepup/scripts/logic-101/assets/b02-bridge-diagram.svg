<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Sơ đồ cây cầu: hai trụ căn cứ nhìn thấy được, nhịp cầu đứt là điều phải tin thêm">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="s3" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr3" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="url(#bg3)"/>

  <text x="500" y="52" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold"
        fill="#0f172a" text-anchor="middle">Nhịp cầu bị giấu</text>

  <!-- ── bờ trái: 2 trụ căn cứ ─────────────────────────────────────────── -->
  <g filter="url(#s3)">
    <rect x="44" y="128" width="286" height="86" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="44" y="238" width="286" height="86" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e293b">
    <text x="68" y="163" font-weight="bold" fill="#2563eb">Căn cứ 1</text>
    <text x="68" y="192">Trang ghi 2.000.000đ</text>
    <text x="68" y="273" font-weight="bold" fill="#2563eb">Căn cứ 2</text>
    <text x="68" y="302">Bạn trả 599.000đ</text>
  </g>

  <!-- thân trụ đỡ -->
  <rect x="150" y="324" width="74" height="128" fill="#cbd5e1"/>
  <rect x="132" y="446" width="110" height="20" rx="4" fill="#94a3b8"/>

  <!-- ── bờ phải: kết luận ─────────────────────────────────────────────── -->
  <g filter="url(#s3)">
    <rect x="670" y="183" width="286" height="86" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1e293b">
    <text x="694" y="218" font-weight="bold" fill="#ea580c">Kết luận</text>
    <text x="694" y="247">Bạn lợi 1.401.000đ</text>
  </g>
  <rect x="776" y="269" width="74" height="183" fill="#cbd5e1"/>
  <rect x="758" y="446" width="110" height="20" rx="4" fill="#94a3b8"/>

  <!-- ── nhịp cầu đứt ở giữa ───────────────────────────────────────────── -->
  <line x1="330" y1="226" x2="670" y2="226" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 12"/>

  <g filter="url(#s3)">
    <rect x="344" y="126" width="312" height="80" rx="14" fill="#fffbeb"
          stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <text x="500" y="158" font-family="Helvetica, Arial, sans-serif" font-size="15"
        fill="#b45309" text-anchor="middle">Món này TỪNG được bán thật</text>
  <text x="500" y="184" font-family="Helvetica, Arial, sans-serif" font-size="15"
        font-weight="bold" fill="#b45309" text-anchor="middle">ở mức 2.000.000đ ?</text>

  <!-- khoảng trống bên dưới nhịp đứt -->
  <text x="500" y="272" font-family="Helvetica, Arial, sans-serif" font-size="46"
        font-weight="bold" fill="#cbd5e1" text-anchor="middle">?</text>
  <text x="500" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15"
        fill="#94a3b8" text-anchor="middle">không có gì đỡ ở đây</text>

  <!-- mũi tên chỉ hướng suy -->
  <path d="M 344 350 L 656 350" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arr3)"/>
  <text x="500" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14"
        fill="#0d9488" text-anchor="middle">hướng suy</text>

  <!-- ── chú thích ─────────────────────────────────────────────────────── -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16">
    <rect x="44" y="506" width="286" height="42" rx="21" fill="#dbeafe"/>
    <text x="187" y="533" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Nhìn thấy được</text>

    <rect x="344" y="506" width="312" height="42" rx="21" fill="#fef3c7"/>
    <text x="500" y="533" font-weight="bold" fill="#b45309" text-anchor="middle">Phải tin thêm</text>

    <rect x="670" y="506" width="286" height="42" rx="21" fill="#ffedd5"/>
    <text x="813" y="533" font-weight="bold" fill="#c2410c" text-anchor="middle">Điều họ muốn bạn tin</text>
  </g>

  <text x="500" y="592" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold"
        fill="#475569" text-anchor="middle">Lỗi trốn ở chỗ không ai nói ra, không phải ở chỗ ai cũng nhìn thấy.</text>
</svg>
