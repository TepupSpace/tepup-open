<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Màn hình bán hàng với giá gốc bị gạch ngang, nối xuống một tấm biển để trống">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="s2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="s2b" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- ── điện thoại ────────────────────────────────────────────────────── -->
  <g filter="url(#s2)">
    <rect x="150" y="52" width="330" height="526" rx="40" fill="#1e293b"/>
    <rect x="163" y="69" width="304" height="492" rx="24" fill="#ffffff"/>
    <rect x="278" y="59" width="74" height="7" rx="3.5" fill="#334155"/>
  </g>

  <!-- ảnh sản phẩm giả lập -->
  <rect x="187" y="97" width="256" height="152" rx="16" fill="#e2e8f0"/>
  <circle cx="243" cy="152" r="21" fill="#cbd5e1"/>
  <path d="M199 237 L262 175 L311 224 L346 194 L431 237 Z" fill="#cbd5e1"/>

  <!-- giá gốc bị gạch ngang -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="187" y="300" font-size="27" fill="#94a3b8">2.000.000đ</text>
    <line x1="182" y1="291" x2="352" y2="291" stroke="#94a3b8" stroke-width="3.5"/>
    <text x="187" y="357" font-size="42" font-weight="bold" fill="#dc2626">599.000đ</text>
  </g>

  <!-- nhãn tiết kiệm -->
  <g filter="url(#s2b)">
    <rect x="187" y="382" width="230" height="40" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="302" y="409" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold"
        fill="#b45309" text-anchor="middle">Tiết kiệm 1.401.000đ</text>

  <!-- nút mua ngay -->
  <rect x="187" y="446" width="256" height="58" rx="16" fill="#f97316"/>
  <text x="315" y="483" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold"
        fill="#ffffff" text-anchor="middle">Mua ngay</text>

  <!-- ── sợi dây từ giá gạch ngang sang tấm biển trống ─────────────────── -->
  <path d="M 352 291 C 470 291 520 300 620 336" fill="none" stroke="#94a3b8"
        stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="352" cy="291" r="7" fill="#94a3b8"/>

  <!-- ── tấm biển TRỐNG đang lơ lửng ───────────────────────────────────── -->
  <g filter="url(#s2)">
    <rect x="620" y="300" width="404" height="196" rx="20" fill="#ffffff"
          stroke="#2563eb" stroke-width="3.5" stroke-dasharray="12 8"/>
  </g>
  <text x="822" y="372" font-family="Helvetica, Arial, sans-serif" font-size="60"
        font-weight="bold" fill="#cbd5e1" text-anchor="middle">?</text>
  <line x1="672" y1="404" x2="972" y2="404" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
  <line x1="672" y1="434" x2="912" y2="434" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
  <line x1="672" y1="464" x2="852" y2="464" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>

  <!-- ── nhãn ──────────────────────────────────────────────────────────── -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(620 262)">
      <rect x="0" y="-30" width="330" height="38" rx="19" fill="#2563eb"/>
      <text x="165" y="-4" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Mảnh không ai nói ra</text>
    </g>
    <text x="620" y="546" font-size="19" font-weight="bold" fill="#475569">Mọi con số trên màn hình đều thật.</text>
    <text x="620" y="576" font-size="19" font-weight="bold" fill="#1e293b">Chỗ hỏng nằm ở chỗ trống này.</text>
  </g>
</svg>
