<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-label="Vòng lặp 3 giai đoạn của thiên kiến xác nhận quanh niềm tin có sẵn">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#64748b"/>
    </marker>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1000" height="820" fill="url(#dbg)"/>

  <text x="500" y="56" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold"
        fill="#0f172a" text-anchor="middle">Vòng lặp 3 giai đoạn của thiên kiến xác nhận</text>

  <!-- vòng tròn nối 3 cụm -->
  <circle cx="500" cy="452" r="212" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="9 9"/>

  <!-- mũi tên vòng lặp: 1 → 2 → 3 → 1 -->
  <g fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M 640 316 A 212 212 0 0 1 700 470"/>
    <path d="M 646 610 A 212 212 0 0 1 366 616"/>
    <path d="M 298 460 A 212 212 0 0 1 358 314"/>
  </g>

  <!-- tâm: niềm tin có sẵn -->
  <g filter="url(#card)">
    <circle cx="500" cy="452" r="92" fill="#0f172a"/>
  </g>
  <text x="500" y="443" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold"
        fill="#ffffff" text-anchor="middle">Niềm tin</text>
  <text x="500" y="469" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold"
        fill="#ffffff" text-anchor="middle">có sẵn</text>

  <!-- ── GIAI ĐOẠN 1 — NẠP THÔNG TIN (trên) ─────────────────────────── -->
  <g filter="url(#card)">
    <rect x="330" y="132" width="340" height="132" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  </g>
  <rect x="330" y="132" width="340" height="40" rx="18" fill="#2563eb"/>
  <rect x="330" y="154" width="340" height="18" fill="#2563eb"/>
  <text x="500" y="159" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold"
        fill="#ffffff" text-anchor="middle">1 · NẠP THÔNG TIN</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e293b">
    <circle cx="366" cy="203" r="4" fill="#2563eb"/>
    <text x="382" y="209">Chú ý chọn lọc</text>
    <circle cx="366" cy="235" r="4" fill="#2563eb"/>
    <text x="382" y="241">Tiếp xúc chọn lọc</text>
  </g>

  <!-- ── GIAI ĐOẠN 2 — XỬ LÝ (phải dưới) ────────────────────────────── -->
  <g filter="url(#card)">
    <rect x="612" y="612" width="352" height="164" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
  </g>
  <rect x="612" y="612" width="352" height="40" rx="18" fill="#f97316"/>
  <rect x="612" y="634" width="352" height="18" fill="#f97316"/>
  <text x="788" y="639" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold"
        fill="#ffffff" text-anchor="middle">2 · XỬ LÝ THÔNG TIN</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e293b">
    <circle cx="648" cy="683" r="4" fill="#f97316"/>
    <text x="664" y="689">Suy luận có động cơ</text>
    <circle cx="648" cy="715" r="4" fill="#f97316"/>
    <text x="664" y="721">Diễn giải lệch</text>
    <circle cx="648" cy="747" r="4" fill="#f97316"/>
    <text x="664" y="753">Chọn quả ngon bỏ quả thối</text>
  </g>

  <!-- ── GIAI ĐOẠN 3 — XUẤT RA (trái dưới) ──────────────────────────── -->
  <g filter="url(#card)">
    <rect x="36" y="612" width="332" height="164" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  </g>
  <rect x="36" y="612" width="332" height="40" rx="18" fill="#0d9488"/>
  <rect x="36" y="634" width="332" height="18" fill="#0d9488"/>
  <text x="202" y="639" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold"
        fill="#ffffff" text-anchor="middle">3 · XUẤT RA</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e293b">
    <circle cx="72" cy="683" r="4" fill="#0d9488"/>
    <text x="88" y="689">Nhớ chọn lọc</text>
    <circle cx="72" cy="715" r="4" fill="#0d9488"/>
    <text x="88" y="721">Niềm tin trơ lì</text>
    <circle cx="72" cy="747" r="4" fill="#0d9488"/>
    <text x="88" y="753">Buồng vọng âm</text>
  </g>

  <!-- chú thích đáy -->
  <text x="500" y="800" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold"
        fill="#475569" text-anchor="middle">Càng tin, càng lọc — càng lọc, càng tin.</text>
</svg>
