<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bảng tin với hai lớp thông tin: lớp khớp niềm tin hiện rõ, lớp ngược chiều mờ đi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screen">
      <rect x="452" y="86" width="296" height="470" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ── dim layer: bằng chứng ngược chiều, mờ và nhỏ ─────────────────── -->
  <g opacity="0.38" font-family="Helvetica, Arial, sans-serif">
    <g filter="url(#softer)">
      <rect x="96" y="132" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="124" cy="160" r="11" fill="#cbd5e1"/>
      <rect x="144" y="153" width="82" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="112" y="182" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="112" y="197" width="164" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g filter="url(#softer)">
      <rect x="120" y="256" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="148" cy="284" r="11" fill="#cbd5e1"/>
      <rect x="168" y="277" width="70" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="136" y="306" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="136" y="321" width="140" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g filter="url(#softer)">
      <rect x="88" y="380" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="116" cy="408" r="11" fill="#cbd5e1"/>
      <rect x="136" y="401" width="92" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="104" y="430" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="104" y="445" width="178" height="8" rx="4" fill="#cbd5e1"/>
    </g>

    <g filter="url(#softer)">
      <rect x="856" y="168" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="884" cy="196" r="11" fill="#cbd5e1"/>
      <rect x="904" y="189" width="76" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="872" y="218" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="872" y="233" width="150" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g filter="url(#softer)">
      <rect x="832" y="300" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="860" cy="328" r="11" fill="#cbd5e1"/>
      <rect x="880" y="321" width="88" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="848" y="350" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="848" y="365" width="168" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g filter="url(#softer)">
      <rect x="866" y="424" width="252" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="894" cy="452" r="11" fill="#cbd5e1"/>
      <rect x="914" y="445" width="66" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="882" y="474" width="220" height="8" rx="4" fill="#94a3b8"/>
      <rect x="882" y="489" width="132" height="8" rx="4" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- ── điện thoại ────────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="440" y="70" width="320" height="502" rx="38" fill="#1e293b"/>
    <rect x="452" y="86" width="296" height="470" rx="22" fill="#ffffff"/>
    <rect x="566" y="76" width="68" height="7" rx="3.5" fill="#334155"/>
  </g>

  <!-- ── bright layer: bằng chứng khớp niềm tin, rõ và đậm ─────────────── -->
  <g clip-path="url(#screen)" font-family="Helvetica, Arial, sans-serif">
    <rect x="452" y="86" width="296" height="46" fill="#f1f5f9"/>
    <rect x="472" y="103" width="96" height="11" rx="5.5" fill="#94a3b8"/>

    <g>
      <rect x="470" y="150" width="260" height="112" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <circle cx="496" cy="178" r="13" fill="#2563eb"/>
      <rect x="520" y="171" width="104" height="10" rx="5" fill="#93c5fd"/>
      <rect x="488" y="204" width="224" height="10" rx="5" fill="#1d4ed8"/>
      <rect x="488" y="222" width="188" height="10" rx="5" fill="#1d4ed8"/>
      <rect x="488" y="240" width="146" height="10" rx="5" fill="#60a5fa"/>
    </g>

    <g>
      <rect x="470" y="280" width="260" height="112" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
      <circle cx="496" cy="308" r="13" fill="#f97316"/>
      <rect x="520" y="301" width="88" height="10" rx="5" fill="#fdba74"/>
      <rect x="488" y="334" width="224" height="10" rx="5" fill="#ea580c"/>
      <rect x="488" y="352" width="200" height="10" rx="5" fill="#ea580c"/>
      <rect x="488" y="370" width="132" height="10" rx="5" fill="#fb923c"/>
    </g>

    <g>
      <rect x="470" y="410" width="260" height="112" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <circle cx="496" cy="438" r="13" fill="#2563eb"/>
      <rect x="520" y="431" width="112" height="10" rx="5" fill="#93c5fd"/>
      <rect x="488" y="464" width="224" height="10" rx="5" fill="#1d4ed8"/>
      <rect x="488" y="482" width="172" height="10" rx="5" fill="#1d4ed8"/>
      <rect x="488" y="500" width="150" height="10" rx="5" fill="#60a5fa"/>
    </g>
  </g>

  <!-- ── nhãn tiếng Việt ───────────────────────────────────────────────── -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(96 92)">
      <rect x="0" y="-22" width="196" height="30" rx="15" fill="#e2e8f0"/>
      <text x="16" y="-2" font-size="15" font-weight="bold" fill="#64748b">Ngược chiều — mờ đi</text>
    </g>
    <g transform="translate(856 128)">
      <rect x="0" y="-22" width="196" height="30" rx="15" fill="#e2e8f0"/>
      <text x="16" y="-2" font-size="15" font-weight="bold" fill="#64748b">Ngược chiều — mờ đi</text>
    </g>
    <g transform="translate(432 596)">
      <rect x="0" y="-24" width="336" height="34" rx="17" fill="#2563eb"/>
      <text x="168" y="-1" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Khớp niềm tin — hiện rõ</text>
    </g>
  </g>
</svg>
