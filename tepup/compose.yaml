# Local, production-like stack for testing: Postgres + the app (`next build` + `next start`).
# Vercel does not use this. From tepup/:
#   docker compose up --build        → http://localhost:3000   (admin: admin / tepup-local-admin)
#   docker compose down -v           → stop and wipe the local database
# The app connects as `tepup_app` (rows only, bypasses RLS, no DDL), like production, so
# role and RLS mistakes show up here first. The schema is pushed as the owner on start.
name: tepup-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${TEPUP_DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    init: true # forward Ctrl+C / docker stop to the Node processes
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEPUP_PORT:-3000}:3000"
    environment:
      # Guard for scripts/docker-seed.ts: it refuses to run anywhere else.
      TEPUP_LOCAL_DOCKER: "1"
      TEPUP_PORT: ${TEPUP_PORT:-3000} # only for the "is up on" message; the app listens on 3000 inside
      DATABASE_URL: postgresql://tepup_app:tepup_app_local@db:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@db:5432/postgres
      AUTH_SECRET: local-docker-only-not-a-real-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:${TEPUP_PORT:-3000}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-tepup-local-admin}
      # Optional: a Groq key makes the AI chat answer; without one it fails gracefully.
      GROQ_API_KEY: ${GROQ_API_KEY:-}

volumes:
  db-data:
