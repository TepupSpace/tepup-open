# Style Guide — fix 1 lần
# Tham chiếu: 02.Workflow.md §2.3

tone: "đời thường, hài hước nhẹ, không châm biếm cá nhân"
voice: "anh/chị bạn thân kể chuyện, không phải giảng viên đại học"

example_origin:
  vn_ratio_minimum: 0.7   # ≥7/10 ví dụ có gốc VN
  vn_sources_preferred:
    - "VnExpress, Tuoi Tre, Tien Phong, Thanh Nien"
    - "Threads/Facebook post công khai"
    - "Tình huống đời thường VN (quán cà phê, mâm cơm, group chat)"
    - "Comment section báo/Reddit VN"

sentence_length:
  target_avg_words: "15-20"
  max_words_per_sentence: 35

paragraph_length:
  target_lines: "3-5"
  max_lines: 8

section_pattern_per_concept:
  - "hook (tình huống/câu chuyện)"
  - "định nghĩa (1-2 câu, không jargon)"
  - "ví dụ 2-3 cái"
  - "phản ví dụ (khi nào KHÔNG phải)"
  - "mini-summary 1 câu"

forbidden_phrases:
  - "nói chung là"
  - "như chúng ta đều biết"
  - "thật vậy"
  - "rõ ràng rằng"
  - "không thể phủ nhận"
  - "ai cũng biết"
  - "hiển nhiên"
  - "đương nhiên"

callback_handling:
  rules:
    - "Khi callback bài trước: nhắc tên bài + 1 câu refresh, không assume học viên còn nhớ chi tiết"
    - "AI được phép tự sinh callback ngoài lesson_spec, miễn là bài được nhắc đã tồn tại trong course-outline.yaml"
    - "Không callback bài tương lai (chưa được giới thiệu)"

jargon_handling:
  rule: "Mọi thuật ngữ học thuật (correlation, ad hominem, framing, ...) phải có định nghĩa đời thường khi xuất hiện lần đầu trong bài"
  format_example: "**ad hominem** (tiếng Latin nghĩa là 'nhắm vào cá nhân') — tức là..."

# Tiếng Việt là chính, tiếng Anh chỉ bổ trợ.
# Được A5 Critic enforce qua rubric #11 (02.Workflow.md §6.1). Trước đây spec này chỉ nằm
# trong 02.Workflow.md §2.3 nên các node phải đi tìm — nay đặt đúng chỗ.
language_convention:
  primary_language: vi
  technical_term_pattern: "tiếng việt (English)"   # Việt trước, Anh trong ngoặc
  first_introduction_only: true                    # lần đầu kèm (English), các lần sau dùng Việt thuần
  casual_english_words: translate                  # check/share/pause/comment/screenshot/feed → dịch thẳng
  preserve_as_is_whitelist:
    - personal_names        # Toulmin, Aristotle, Kahneman, Tversky, Hansen…
    - brands_platforms      # Facebook, Threads, Shopee, VnExpress, Kenh14…
    - established_jargon    # System 1/2 (vẫn nên prefix "Hệ thống"), FUD, hodl
    - zodiac_terms          # Scorpio, Bọ Cạp, Song Tử — VN dùng song song
    - identifiers           # LO1, B01, c1, v1, §0…
  examples_correct:
    - "tiền đề (premise)"
    - "kết luận (conclusion)"
    - "đúng cấu trúc (valid)"
    - "vững (sound)"
    - "thiên kiến xác nhận (confirmation bias)"
    - "neo giá (anchoring)"
  examples_wrong:
    - "confirmation bias (thiên kiến xác nhận)"   # SAI: tiếng Anh đứng trước
    - "feed Facebook"                              # SAI: bare English không có Việt
    - "check lại nguồn"                            # SAI: casual word chưa dịch

humor_guidelines:
  do:
    - "Châm biếm tình huống chung (vd: 'group chat họ hàng 2/9')"
    - "Tự trào (vd: 'chính mình cũng từng tin')"
    - "Pop culture VN trung tính (vd: phim, meme phổ biến)"
  dont:
    - "Châm biếm cá nhân cụ thể (kể cả celebrity)"
    - "Châm biếm vùng miền, giới tính, tôn giáo"
    - "Sarcasm nặng — học viên có thể đọc nhầm"
