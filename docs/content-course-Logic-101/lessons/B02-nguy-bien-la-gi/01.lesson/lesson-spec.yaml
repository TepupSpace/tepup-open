lesson_id: B02
title: Ngụy biện là gì?
slug: nguy-bien-la-gi
level: 1
position_in_level: 2 of 4
practice_required: false
one_line_summary_from_outline: Định nghĩa và ngôn ngữ chung cho phân tích lập luận

key_concepts_from_outline:
- tiền đề (premise)
- kết luận (conclusion)
- đúng cấu trúc (valid)
- vững (sound)
- tiền đề ẩn (hidden premise / enthymeme)
- "ngụy biện = lỗi ở CÁCH SUY, không phải ở sự thật"

# ─── Xử lý thuật ngữ: quyết định của PM ───────────────────────────────────────
# valid/sound là từ vựng logic hình thức — thứ 01.Content-structure.md §2 CỐ Ý loại khỏi
# khoá ("tam đoạn luận quá trừu tượng, gây mất hứng ngay từ đầu"). Giải pháp: giữ khái niệm,
# gọi bằng tiếng Việt theo style-guide (Việt trước, Anh trong ngoặc, chỉ lần đầu xuất hiện):
#   valid → "đúng cấu trúc (valid)"   — suy có chặt không?
#   sound → "vững (sound)"            — suy chặt VÀ căn cứ có thật
term_handling:
  valid: "đúng cấu trúc (valid)"
  sound: "vững (sound)"
  forbidden_devices:
  - "bảng chân trị (truth table)"
  - "ký hiệu logic hình thức (P → Q, ∀, ∃)"
  - "tam đoạn luận sách giáo khoa (\"Mọi người đều phải chết. Socrates là người…\")"

learning_objectives:
- "LO1 (Understand): Tách được tiền đề và kết luận từ 1 câu thoại đời thường, và nói được ngụy biện là lỗi ở CÁCH SUY chứ không phải ở sự thật — verify trong bài qua {!CHECK#1} cuối §1 (MCQ 4 lựa chọn, có 1 nhiễu là 'nói sai sự thật')"
- "LO2 (Analyze): Phân biệt được 'đúng cấu trúc (valid)' và 'vững (sound)', và chỉ ra được tiền đề ẩn trong 1 lập luận nghe hợp lý — verify trong bài qua {!CHECK#2} cuối §2"
- "LO3 (Apply): Áp dụng được 3 câu hỏi kiểm tra (kết luận là gì? / căn cứ là gì? / có căn cứ nào bị giấu?) lên 1 lập luận MỚI chưa gặp trong bài — verify trong bài qua {!CHECK#3} cuối §3"

# ─── Vì sao chọn miền MARKETING làm anchor ────────────────────────────────────
# Quảng cáo BẢN CHẤT là lập luận: luôn có kết luận ("mua đi"), luôn có căn cứ, và gần như
# luôn giấu một tiền đề. Học viên gặp nó vài chục lần mỗi ngày và đứng đúng ở phía người
# mắc lỗi (người mua). Đây là miền cho phép anchor liên tục chạm vào "ngụy biện" thay vì
# chỉ là một lập luận ngẫu nhiên — điều B02 cần, vì B02 dạy CÁCH MỔ XẺ lập luận.
#
# Ràng buộc chọn ví dụ trong miền này: lỗi phải nằm ở TIỀN ĐỀ ẨN. Tránh mọi quảng cáo mà
# lỗi chính là viện dẫn thẩm quyền ("9/10 nha sĩ khuyên dùng" → B07) hoặc nhân quả
# ("người dùng X có da đẹp hơn" → B03).

key_examples_seed:
- |
  ANCHOR (xuyên §1 → §3): giá gốc gạch ngang trên sàn thương mại điện tử.
  Quảng cáo: "Giá gốc 2.000.000đ — nay chỉ còn 599.000đ. Mua ngay, tiết kiệm 1.401.000đ!"

    §1 TÁCH — tiền đề 1: trang bán hàng có ghi 2.000.000đ   (ĐÚNG — nhìn thấy trên màn hình)
              tiền đề 2: bạn trả 599.000đ                    (ĐÚNG — đúng số tiền bị trừ)
              kết luận : bạn lợi 1.401.000đ
              → KHÔNG câu nào nói dối. Đây là cú "aha" của bài: căn cứ đúng hết mà kết
                luận vẫn sai. Chính vì không ai nói dối nên ta mới không đề phòng.

    §2 ĐÀO SÂU — tiền đề ẩn không ai phát biểu ra:
                 "món này TỪNG được bán thật ở mức 2.000.000đ".
              Viết tiền đề ẩn ra giấy → suy luận trở nên ĐÚNG CẤU TRÚC (valid): nếu cả 3
              căn cứ đúng thì kết luận buộc phải đúng. Nhưng chính tiền đề ẩn đó mới sai
              (giá gốc dựng lên chỉ để gạch ngang) → lập luận KHÔNG VỮNG (sound).
              Bài học lõi: lỗi trốn ở chỗ KHÔNG AI NÓI RA, không phải ở chỗ ai cũng nhìn thấy.
              Đây cũng là chỗ dạy sạch nhất cặp "đúng cấu trúc" vs "vững".

    §3 KHÁI QUÁT — cùng khuôn đó áp lên 2 quảng cáo khác (xem SECONDARY), rồi rút ra
              framework 3 câu hỏi ở target_takeaway.

    HỌ LỖI: neo giá (anchoring). KHÔNG trùng B05-B08 (ad hominem / strawman / thẩm quyền /
    trượt dốc / lưỡng nan giả) và không trùng B03 (nhân quả) — nên B02 không ăn phần bài sau.
- |
  SECONDARY #1 (§3): "Chỉ còn 3 suất cuối — nhanh tay kẻo lỡ!"
  tiền đề: trên trang có hiện dòng đó (ĐÚNG). kết luận: phải quyết ngay.
  tiền đề ẩn: "con số 3 suất phản ánh tồn kho thật". Cùng khuôn với anchor: căn cứ hiển thị
  là thật, mốc so sánh / con số nền là do người bán dựng.
- |
  SECONDARY #2 (§3): "Giá này chỉ áp dụng hôm nay, mai về giá niêm yết."
  tiền đề ẩn: "có tồn tại một 'giá niêm yết' mà ngày mai thực sự sẽ quay về".
  Chọn cái này vì học viên KIỂM CHỨNG ĐƯỢC: mở lại trang hôm sau là biết.
- |
  PHẢN VÍ DỤ BẮT BUỘC (§1, chống hyper-skepticism): 1 lập luận VỮNG trong cùng bối cảnh mua sắm.
  Vd: "Sàn ghi phí giao hàng 25.000đ. Đơn của tôi không đạt mốc miễn phí giao hàng.
  → Tôi sẽ bị tính 25.000đ." Căn cứ thật, suy chặt, không tiền đề ẩn nào → VỮNG.
  Thông điệp bắt buộc: không phải quảng cáo nào cũng có bẫy, và học bài này không phải
  để đi cãi mọi thứ. Thiếu đoạn này thì bài đẻ ra người hoài nghi cực đoan.
- |
  PHÂN BIỆT BẮT BUỘC (§1): "nói sai sự thật" KHÁC "ngụy biện".
  "Sản phẩm này được NASA chứng nhận" (trong khi không hề có) → NÓI SAI SỰ THẬT, không phải
  ngụy biện — đó là nói dối, bắt được bằng cách đi kiểm tra.
  "Giá gốc 2.000.000đ, nay còn 599.000đ, bạn lợi 1.401.000đ" → mọi căn cứ ĐÚNG, CÁCH SUY sai
  → đây mới là ngụy biện. Và đây là loại nguy hiểm hơn, vì không có gì để "bắt quả tang".

anchor_refs_seed:
- type: framework
  hint: "Toulmin 1958 — The Uses of Argument. Khái niệm 'warrant' chính là tiền đề ẩn: cầu nối ngầm giữa căn cứ và kết luận mà người nói không phát biểu ra. Anchor lý thuyết mạnh nhất cho §2."
- type: framework
  hint: "Enthymeme (Aristotle, Rhetoric) — lập luận cố ý bỏ bớt 1 tiền đề vì cho rằng người nghe tự điền vào. Giải thích VÌ SAO tiền đề ẩn phổ biến đến thế trong nói chuyện hàng ngày."
- type: paper
  hint: "Stanford Encyclopedia of Philosophy — 'Fallacies' (Hansen). Định nghĩa fallacy = lỗi suy luận CÓ HỆ THỐNG, lặp theo khuôn; phân biệt với sai sót ngẫu nhiên và với nói dối."
- type: paper
  hint: "SEP / Internet Encyclopedia of Philosophy — 'Validity and Soundness'. Nguồn chuẩn cho cặp valid vs sound. Researcher chỉ lấy ĐỊNH NGHĨA, tuyệt đối không bê ví dụ tam đoạn luận của họ vào bài."

# Researcher phải bổ sung tối thiểu 5 ví dụ gốc VN (course-context.yaml::vn_examples_minimum).
# Hướng tìm — đều là chuyện mua sắm / quảng cáo đời thường, KHÔNG phải bình luận chính sách.
# LƯU Ý QUAN TRỌNG cho Researcher: tìm bài báo / kết luận kiểm tra Ở DẠNG TỔNG HỢP
# ("khảo sát cho thấy nhiều gian hàng nâng giá gốc trước đợt sale"), KHÔNG lấy vụ việc quy
# kết đích danh 1 nhãn hàng hay 1 shop cụ thể — xem forbidden_examples.
research_directions:
- "Báo VN (VnExpress/Tuoi Tre/Thanh Nien/Dan Tri) về chiêu nâng giá gốc trước đợt sale ('sale ảo', 'giá gốc ảo') trên sàn thương mại điện tử — hậu thuẫn trực tiếp tiền đề ẩn của ANCHOR"
- "Quy định / hướng dẫn về ghi giá khuyến mãi và cách xác định 'giá gốc' hợp lệ tại VN — dùng để cho thấy tiền đề ẩn đó có thể kiểm chứng được, không phải chuyện cảm tính"
- "Số liệu về quy mô mua sắm online của người 22-35 tại VN — dùng ở §0 Hook để chứng minh 'chuyện này xảy ra với bạn mỗi tuần'"
- "Nghiên cứu về hiệu ứng neo giá (price anchoring) trong hành vi mua hàng — nối tiền đề ẩn của anchor với cơ chế tâm lý, tier A"

connections:
  builds_on:
  - B01
  sets_up:
  - B03
  callbacks:
  - "§0 hoặc §2 — nhắc B01 (confirmation bias): khi kết luận khớp với điều ta ĐANG MUỐN tin (rằng mình vừa mua hời), ta không thèm đi tìm tiền đề ẩn. B01 giải thích VÌ SAO ta lười kiểm tra; B02 đưa CÔNG CỤ để kiểm tra. Nhắc tên bài + 1 câu refresh, không giả định học viên còn nhớ chi tiết."
  - "§5 — nối sang B03 (Correlation ≠ Causation): 'cái gì gây ra cái gì' chính là một loại tiền đề ẩn cụ thể, loại phổ biến nhất khi đọc số liệu."
