target_takeaway: |
  Khi nghe một câu dạng "A, cho nên B" mà thấy mình gật đầu ngay, dừng lại hỏi 3 câu:
    (1) Kết luận là gì?      — người này muốn mình tin điều gì?
    (2) Căn cứ là gì?        — họ đưa ra cái gì làm bằng chứng?
    (3) Căn cứ nào bị giấu?  — phải tin thêm điều gì nữa thì (2) mới dẫn tới (1)?
  Câu (3) là nơi lỗi trốn. Và nhớ: căn cứ ĐÚNG SỰ THẬT vẫn có thể dẫn tới kết luận sai —
  ngụy biện là lỗi ở CÁCH SUY, không phải ở sự thật.

forbidden_examples:
- "Mọi ví dụ chính trị / chính sách nhà nước (lương tối thiểu, bảo hiểm xã hội, thuế, cấm xe máy…) — chạm forbidden_zone #1, #2. Level 1 cố ý giữ ở phạm vi 'chuyện của bạn'; chính sách để dành B13-B16, riêng B14 là bài Đánh giá chính sách."
- "Đảng / chính trị gia / lãnh đạo VN cụ thể — forbidden_zone #1"
- "Tôn giáo, tín ngưỡng cụ thể"
- "KOL / celebrity VN cụ thể — forbidden_zone #3 (châm biếm cá nhân)"
- "So sánh chế độ chính trị một phía — forbidden_zone #4"
- "KHÔNG quy kết đích danh 1 nhãn hàng / shop / sàn thương mại điện tử cụ thể là bên nâng giá gốc ảo. Quảng cáo trong bài phải là mẫu chung (dạng '2.000.000đ → 599.000đ'), hoặc dẫn từ báo ở dạng tổng hợp. Lý do: (a) quy kết đích danh là cáo buộc gian lận thương mại, ngoài phạm vi bài học logic; (b) tinh thần forbidden_zone #3 — không lấy một chủ thể cụ thể ra làm bia."
- "KHÔNG để bài trượt thành 'quảng cáo toàn lừa đảo'. Phản ví dụ VỮNG ở §1 là bắt buộc, và §5 phải nói rõ: công cụ này để KIỂM TRA, không phải để bác bỏ mọi thứ."
- "TRÙNG LẶP VỚI LEVEL 2 — không dùng ví dụ mà lỗi chính là ad hominem (B05), strawman (B06), appeal to authority (B07), slippery slope hoặc false dilemma (B08). B02 chỉ dạy BỘ TỪ VỰNG để mổ xẻ lập luận; gọi tên từng loại ngụy biện là phần của Level 2. Nếu ví dụ rơi đúng vào 1 trong 5 loại đó, đổi ví dụ."
- "Ví dụ mà lỗi nằm ở tương quan / nhân quả — đó là B03, không phải B02."
