- "Pro/anti vaccine confirmation bias — vừa sức khoẻ vừa chính trị hoá, gây tranh cãi không cần thiết"
- "Pro/anti tôn giáo/tín ngưỡng cụ thể (Phật giáo, Công giáo, đạo Mẫu…) — gây tổn thương người đọc"
