lesson_id: B01
title: Confirmation bias
slug: confirmation-bias
level: 1
position_in_level: 1 of 4
practice_required: true
one_line_summary_from_outline: Não bạn ngầm lọc thông tin để khớp với cái bạn đã tin sẵn

key_concepts_from_outline:
- confirmation bias
- "3-stage loop: input / processing / output bias"
- selective attention / selective exposure
- motivated reasoning
- cherry-picking evidence
- biased interpretation
- belief perseverance
- echo chamber reinforcement

learning_objectives:
- "LO1 (Remember/Understand): Định nghĩa được confirmation bias bằng 1 câu không có jargon, và phân biệt với 2 khái niệm gần (motivated reasoning, cherry-picking) — verify trong bài qua câu hỏi định nghĩa + matching"
- "LO2 (Apply): Phát hiện được confirmation bias trong 1 post FB/Threads được cung cấp trong bài, chỉ ra cụ thể chi tiết nào bị skip — verify trong bài qua free-text response"
- "LO3 (Apply/Analyze): Trong 2-3 bài luyện tập tăng dần độ khó (đặc tả ở practice-spec.yaml), học viên áp dụng 2-trigger filter (stake × khớp ngọt) để nhận diện confirmation bias qua nhiều LOẠI × nhiều TÌNH HUỐNG, đạt ≥70% câu đúng tổng"

key_examples_seed:
- "ANCHOR (xuyên §1 + §2): Cung hoàng đạo / astrology — niềm tin 'người Scorpio thường possessive' cover trọn 3 stage × 13 sub-type. Stage 1 Input (follow page astrology, search 'Scorpio in love', algorithmic confirmation, echo chamber). Stage 2 Processing (selective attention, biased interpretation, motivated reasoning, disconfirmation bias, biased assimilation, expectation bias). Stage 3 Output (selective recall, illusory correlation, belief perseverance, attitude polarization, self-confirmation). Công thức loop: niềm tin → lọc dữ liệu → diễn giải lệch → ký ức lệch → niềm tin mạnh hơn"
- "SECONDARY (cho §3 generalization, Researcher mở rộng từ báo VN): Crypto/stock bag holder — niềm tin 'VN-Index/BTC sẽ lên' chạy đúng pattern 3-stage qua context investment"
- "SECONDARY (cho §3, Researcher mở rộng): Diet/health belief (detox nước chanh / intermittent fasting) — niềm tin sức khoẻ chạy 3-stage, ignore counter-evidence từ study"

anchor_refs_seed:
- type: paper
  hint: "Nickerson 1998 — 'Confirmation Bias: A Ubiquitous Phenomenon in Many Guises' (Review of General Psychology) — review canonical, cover trọn 3 stage"
- type: framework
  hint: "Wason 2-4-6 task (Wason 1960) — thí nghiệm classic, học viên có thể tự thử trong §2 để thấy bias trên chính mình"
- type: framework
  hint: "Barnum effect (Forer 1948) — bắt buộc kèm zodiac anchor, giải thích VÌ SAO mô tả cung hoàng đạo 'feels personal'"
- type: paper
  hint: "Kahneman — Thinking, Fast and Slow (System 1/2 dual-process) — nền tảng cơ chế não dẫn đến bias; cũng bridge sang B19 (Intellectual humility / calibration)"

