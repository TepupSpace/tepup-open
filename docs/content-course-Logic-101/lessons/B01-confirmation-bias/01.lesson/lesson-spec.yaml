target_takeaway: |
  IF (cả 2 điều kiện đúng):
    (1) Stake cao — học viên sắp share, tranh luận, hoặc ra quyết định dựa vào tin này
    (2) Khớp quá ngọt — học viên thấy "đúng rồi!" ngay, không có gì cấn (đặc biệt nếu xác nhận điều đã bực sẵn)
  THEN (theo thứ tự):
    - Pause
    - Tự hỏi: "Mình đang bỏ qua chi tiết nào để tin cái này dễ hơn?"
    - Đọc 1 nguồn nói ngược TRƯỚC KHI share/act
  ELSE:
    - Pass-through trust — không phải tin nào cũng cần verify (tránh hyper-skepticism)

forbidden_examples:
