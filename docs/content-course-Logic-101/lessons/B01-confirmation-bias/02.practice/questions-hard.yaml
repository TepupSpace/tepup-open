tier: hard
questions:
  - q_id: q21
    stem: "Đạt review nhân viên Lan trong 12 tháng — Lan có 8 dự án, 6 thành công và 2 fail. Đạt vốn nghĩ Lan tốt nên đọc data thành '6 thành công chứng tỏ năng lực, 2 fail là bad luck'. Đồng nghiệp Tâm review cùng Lan với data giống hệt nhưng vốn nghĩ Lan trung bình, đọc thành '6 thành công là lucky đơn giản, 2 fail chứng tỏ judgement yếu'. Hai người mắc cùng một lỗi gì?"
    type_tested: "biased interpretation"
    situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
    options:
      A: "Cherry-picking evidence — cả hai chọn lọc data để justify quan điểm có sẵn về Lan."
      B: "Motivated reasoning — cả hai có động cơ cá nhân để diễn giải data theo hướng mình muốn."
      C: "Biased interpretation — cùng một bộ data, hai người diễn giải ngược nhau theo niềm tin sẵn có; thành công thành 'năng lực' hoặc 'may mắn', fail thành 'bad luck' hoặc 'yếu kém', tuỳ niềm tin trước."
      D: "Không có lỗi gì — manager có quyền có judgement chủ quan dựa trên kinh nghiệm cá nhân."
    correct: C
    explanation: "Đây là biased interpretation kinh điển kiểu Lord-Ross-Lepper [c4] — chìa khoá nhận diện là cả hai dùng CÙNG bộ data nhưng đọc ra hai kết luận trái ngược. Họ không skip bằng chứng (cherry-pick) cũng không tự xây lý lẽ mới (motivated reasoning) — họ diễn giải lại 6 thành công và 2 fail theo lăng kính niềm tin trước. Cùng evidence, hai phe càng đọc càng cách xa — đúng pattern attitude polarization."
    distractor_explanations:
      A: "Cherry-picking yêu cầu BỎ QUA bằng chứng ngược; ở đây cả hai đều nhìn vào TOÀN BỘ 8 dự án, không loại data nào. Khác biệt nằm ở cách diễn giải cùng data — đó là biased interpretation, không phải cherry-pick."
      B: "Motivated reasoning đòi hỏi có động cơ rõ ràng và xây lý lẽ phụ trợ để bảo vệ kết luận muốn có; ở đây Đạt và Tâm chỉ đơn giản đọc data qua lăng kính niềm tin sẵn có, không xây lý lẽ mới hay có motive cá nhân (tăng lương, đánh nhau...). Subtle nhưng quan trọng — interpretation lệch ≠ reasoning có động cơ."
      D: "Manager judgement chủ quan OK trong vùng mơ hồ; nhưng khi CÙNG data tạo ra hai kết luận đối nghịch tuỳ niềm tin trước, đó là dấu hiệu bias systematic chứ không phải insight cá nhân. Đó là chính xác điều bias review process cần guardrail."
    ref_citation_id: c4

  - q_id: q22
    stem: "Khoa mua một cổ phiếu midcap, hold 18 tháng và đã giảm 60%. Earnings report 4 quý gần nhất đều miss kỳ vọng. Bạn khuyên cắt lỗ vì 'doanh nghiệp đang đi xuống thật sự'. Khoa đọc earnings kỹ và nói 'gross margin có giảm nhưng management vẫn nói tích cực về long-term — họ có vision'. Khoa hold thêm 6 tháng, giảm thêm 20%. Khoa mắc lỗi nghiêm trọng nhất là gì?"
    type_tested: "belief perseverance"
    situation: "đầu tư / tiền (crypto, stock, scheme, MMO)"
    options:
      A: "Motivated reasoning — Khoa muốn tin cổ phiếu hồi nên xây lý lẽ 'long-term vision' để justify."
      B: "Belief perseverance — bằng chứng ngược chiều rõ ràng (4 quý miss, giảm 60%) đã đến tận tay Khoa, anh đọc kỹ, nhưng niềm tin 'cổ phiếu này tốt' vẫn không bị xét lại — Khoa explain away bằng narrative quote từ management."
      C: "Sunk cost fallacy — Khoa giữ vì đã bỏ tiền vào, không muốn 'lãng phí'."
      D: "Không có lỗi gì — long-term investor không nên react theo earnings ngắn hạn."
    correct: B
    explanation: "Đây là belief perseverance ở stage Output — đặc trưng là bằng chứng phủ định đã đến rõ ràng (4 quý miss + giảm 60% + bạn bè nhắc), Khoa ĐỌC kỹ, nhưng niềm tin gốc 'cổ phiếu này tốt' không hề bị xét lại. Anh chỉ explain away bằng cách bám vào management narrative — đây là dấu hiệu kinh điển bias trơ lì kiểu Lord-Ross-Lepper. Khác sunk cost ở chỗ vấn đề không phải tiếc tiền đã mất mà là niềm tin gốc không update theo evidence."
    distractor_explanations:
      A: "Motivated reasoning overlap nhưng belief perseverance nổi hơn — Khoa không đơn thuần xây lý lẽ mới, anh đã có niềm tin gốc cứng và 4 quý miss + bạn bè cảnh báo đáng lẽ đủ để update belief mà vẫn không update. Tiêu chí phân biệt là 'có evidence ngược chiều rõ ràng vs không' — ở đây có rất rõ ràng."
      C: "Sunk cost fallacy giải thích 'giữ vì đã đầu tư', nhưng confirmation bias variant rõ hơn vì cốt lõi Khoa không cập nhật niềm tin 'cổ phiếu này tốt' dù earnings 4 quý liên tiếp đã phản bác. Đây là lỗi nhận thức (không update belief) chứ không phải lỗi accounting (tiếc tiền)."
      D: "Long-term investor vẫn phải react với fundamental thay đổi — 4 quý miss liên tiếp là fundamental signal, không phải noise ngắn hạn. Lý lẽ 'long-term' ở đây chính là cách Khoa rationalize để không update belief."
    ref_citation_id: v3

  - q_id: q23
    stem: "Yến 38 tuổi, không khám định kỳ 5 năm vì 'tôi cảm thấy khoẻ, nhà tôi không ai bệnh nặng'. Khi bạn nhắc nhiều bệnh ung thư giai đoạn đầu không có triệu chứng, Yến đáp 'nhưng nhà tôi gen tốt — bà tôi sống tới 90. Nếu có bệnh tôi đã cảm thấy. Hơn nữa tôi không có thời gian'. Yến mắc lỗi nghiêm trọng nhất là gì?"
    type_tested: "motivated reasoning"
    situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
    options:
      A: "Biased interpretation — Yến đang diễn giải data gia đình theo cách có lợi."
      B: "Motivated reasoning — Yến đã muốn tránh khám (kết luận muốn có) rồi xếp đặt ba lý lẽ riêng biệt (gen tốt từ bà, cảm thấy khoẻ, không có thời gian) để justify; nếu một lý lẽ bị bác, vẫn còn hai cái khác đỡ."
      C: "Không có lỗi gì — quyết định về sức khoẻ cá nhân là quyền tự chủ y tế của Yến."
      D: "Appeal to nature — Yến đang dựa vào 'tự nhiên gen tốt' nên không cần can thiệp y học."
    correct: B
    explanation: "Đây là motivated reasoning kiểu Kunda 1990 [c6] — Yến có kết luận muốn đi sẵn ('không cần khám') rồi build một loạt lý lẽ nghe có vẻ hợp lý để justify. Dấu hiệu chẩn đoán quan trọng — ba lý lẽ độc lập (gen, cảm giác, thời gian) không liên quan logic với nhau nhưng được gom lại để cùng bảo vệ một kết luận, kiểu 'phòng thủ nhiều lớp'. Yến TIN VÀO lập luận của mình, không nói dối — chỉ là lập luận được tạo ra để giữ kết luận, không phải để tìm sự thật."
    distractor_explanations:
      A: "Biased interpretation gần đúng nhưng Yến không có CÙNG bộ data cụ thể được diễn giải hai cách — cô đang xây lý lẽ mới ngoài data (kéo bà 90 tuổi vào, kéo 'cảm thấy' vào, kéo 'không thời gian' vào). Đó là motivated reasoning rõ hơn."
      C: "Quyền tự chủ y tế OK về mặt nguyên tắc, nhưng câu hỏi ở đây không phải 'quyền' mà là 'chất lượng lý lẽ'. Khi ba lý lẽ rời rạc được gom để bảo vệ một quyết định mà bằng chứng dịch tễ học phủ định (nhiều ung thư giai đoạn đầu không triệu chứng), đó vẫn là bias nhận thức bất kể quyền."
      D: "Appeal to nature chỉ đúng với một trong ba lý lẽ (gen tự nhiên); hai lý lẽ còn lại (cảm thấy, không thời gian) không thuộc appeal to nature. Phải gọi tên cái khung lớn hơn bao quát cả ba — đó là motivated reasoning."

  - q_id: q24
    stem: "Phương nói: 'Cung hoàng đạo có lý — bạn thân tôi là Scorpio rất sâu sắc, sếp tôi Scorpio rất đam mê, tôi follow 3 KOL Scorpio ai cũng huyền bí — đó là 5 case tôi biết.' Khi bạn hỏi 'thế còn 10 Scorpio khác bạn quen mà không như vậy?', Phương đáp 'họ là exception, không tiêu biểu'. Phương mắc lỗi nghiêm trọng nhất là gì?"
    type_tested: "cherry-picking evidence"
    situation: "đời thường (cung hoàng đạo, đội bóng, tribe tech iPhone/Android, mê tín dị đoan)"
    options:
      A: "Biased interpretation — Phương diễn giải 'sâu sắc/đam mê/huyền bí' theo Forer effect."
      B: "Hasty generalization — Phương kết luận từ 5 case về toàn bộ cung Scorpio."
      C: "Cherry-picking evidence — Phương chọn đúng 5 Scorpio 'khớp', và khi nhắc 10 Scorpio không khớp thì gạt thành 'exception'; hành vi loại trừ chủ động bằng chứng ngược chiều là dấu hiệu trung tâm."
      D: "Không có lỗi gì — observation từ 5 người quen là evidence cá nhân hợp lý."
    correct: C
    explanation: "Đây là cherry-picking điển hình [v4] — chìa khoá nhận diện không phải chỉ 'chọn 5 case', mà cụ thể là HÀNH VI LOẠI TRỪ chủ động khi đối mặt với counter-evidence: 10 Scorpio ngược chiều bị gạt thành 'exception, không tiêu biểu'. Đó là cherry-pick có chủ ý duy trì mẫu thiên lệch. Biased interpretation cũng hiện diện ở việc đọc 'sâu sắc/huyền bí' (Forer), nhưng hành vi cô lập 5 case + loại 10 case là cherry-pick rõ rệt hơn."
    distractor_explanations:
      A: "Biased interpretation có hiện diện (vì 'sâu sắc/huyền bí' là diễn giải mơ hồ theo Forer), nhưng cốt lõi câu chuyện là Phương đã CHỌN 5 + LOẠI 10 — hành vi pick/skip bằng chứng. Đó là cherry-pick chính xác hơn."
      B: "Hasty generalization (kết luận vội từ mẫu nhỏ) là một fallacy logic liên quan nhưng không phải variant của confirmation bias. Bài học đang dạy về 6 sub-type CB; cherry-pick là gọi tên trong khung CB chính xác hơn cho hành vi 'chọn 5 confirming, loại 10 disconfirming'."
      D: "Observation cá nhân chỉ valid khi mẫu thử có đại diện. Phương đã chủ động loại 10/15 Scorpio ngược chiều ra khỏi 'mẫu' — đó là dấu hiệu mẫu thử bị curate, không phải observation tự nhiên."
    ref_citation_id: v4

  - q_id: q25
    stem: "Sếp Tâm vốn tin nhân viên Huy là top performer. Cuối quý, data cho thấy Huy chỉ ở mức average — completion rate 65% trong khi đồng nghiệp ngang hàng đạt 75-80%. Tâm đọc data, ngạc nhiên, tự nói 'có lẽ tôi đã bias vì Huy nói chuyện confident'. Tâm xin meeting với HR để hỏi rubric, đọc thêm performance report của 5 nhân viên khác, và update đánh giá Huy từ 'top' xuống 'average'. Tâm có đang mắc confirmation bias không?"
    type_tested: "biased interpretation"
    situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
    options:
      A: "Có — Tâm đang biased interpretation vì niềm tin gốc về Huy đã ảnh hưởng đánh giá."
      B: "Có — Tâm đang belief perseverance vì vẫn giữ một phần niềm tin Huy có điểm tốt."
      C: "KHÔNG — đây là rational belief update theo evidence. Confirmation bias yêu cầu giữ niềm tin BẤT CHẤP evidence; Tâm đã chủ động xin data thêm, thừa nhận có thể bias trước đó, và update đánh giá THEO data. Đó là dấu hiệu tỉnh táo, ngược với CB."
      D: "Có — Tâm đang motivated reasoning vì đang xây lý lẽ để hạ Huy xuống."
    correct: C
    explanation: "Đây là edge case quan trọng — phân biệt confirmation bias với rational belief update. Confirmation bias = giữ niềm tin BẤT CHẤP evidence ngược chiều (như Khoa ở q22 hay Yến ở q23). Rational update = thay đổi niềm tin THEO evidence ngược chiều. Hành vi cụ thể của Tâm — thừa nhận bias có thể đã ảnh hưởng, xin rubric HR, đọc thêm 5 report khác để có baseline, và đổi đánh giá từ 'top' sang 'average' — chính là counter-example mà bài học gọi tên: bác sĩ chủ động tìm diagnosis ngược, hay 'adversarial collaboration'. Nếu hành vi này bị gọi là bias thì không còn cách nào để KHÔNG bị gọi là bias."
    distractor_explanations:
      A: "Tâm đã ĐỔI đánh giá theo data — đó là điều ngược với biased interpretation. Biased interpretation đòi hỏi giữ niềm tin gốc qua việc đọc lại data; Tâm đã làm ngược lại. Nếu chọn A, bạn đang nhầm 'có niềm tin gốc' với 'mắc bias' — mọi người đều có prior beliefs, vấn đề là có update khi evidence đến hay không."
      B: "Belief perseverance đòi hỏi giữ niềm tin DÙ đã có evidence rõ ràng phủ định — đây chính là chiều ngược. Tâm đã update từ 'top' xuống 'average' khi thấy data. Không có perseverance ở đây."
      D: "Motivated reasoning đòi hỏi có động cơ cá nhân để đi đến kết luận muốn — Tâm không có motive ở đây (không có gì lợi cho Tâm nếu Huy bị hạ); ngược lại, Tâm đang phải overcome niềm tin trước của chính mình. Đó là intellectual honesty, không phải motivated reasoning."

  - q_id: q26
    stem: "Bác sĩ An khám bệnh nhân 35 tuổi với triệu chứng đau đầu thoáng qua. Khám lâm sàng bình thường, theo guideline đa số case như này không cần MRI. Nhưng An vẫn order MRI và giải thích: 'symptom thoáng qua + tuổi 35 + giới nữ có rủi ro nhỏ về aneurysm; thà order extra test mà 99% lành tính còn hơn miss 1% case nghiêm trọng'. An có đang mắc confirmation bias (cố tìm bằng chứng để xác nhận chẩn đoán hiểm) không?"
    type_tested: "biased interpretation"
    situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
    options:
      A: "Có — biased interpretation, An đang đọc symptom thoáng qua theo hướng bệnh hiểm để justify MRI."
      B: "Có — motivated reasoning, An có động cơ order extra test (lo lắng cá nhân) nên xây lý lẽ để confirm chẩn đoán hiểm."
      C: "Có — cherry-picking evidence, An chọn 1% case nghiêm trọng làm reference và bỏ qua 99% case lành tính."
      D: "KHÔNG — đây là calibrated skepticism / skeptical priors với evidence khách quan. Confirmation bias đòi hỏi STARTING BELIEF + filter evidence theo niềm tin; ở đây An KHÔNG có niềm tin trước là bệnh nhân bệnh hiểm — An open belief, chỉ hedging với prior probability về rare risk. Đó là Bayesian caution, không phải bias."
    correct: D
    explanation: "Edge case kinh điển — confirmation bias đòi hỏi hai yếu tố: (1) niềm tin sẵn có và (2) filter/diễn giải evidence theo niềm tin đó. Bác sĩ An KHÔNG có starting belief 'bệnh nhân này bị aneurysm' — anh đang dùng base rate dịch tễ học (có rủi ro nhỏ về aneurysm ở demographic này) để hedge against false negative. Hành vi 'thà 99% lành tính còn hơn miss 1% case' là quyết định dưới uncertainty với asymmetric cost (false negative = chết người, false positive = chi phí + lo lắng) — đây là Bayesian / calibrated skepticism, đúng quy trình lâm sàng. Nhầm caution với bias là sai lầm phổ biến."
    distractor_explanations:
      A: "Biased interpretation đòi hỏi An đã có niềm tin trước về một chẩn đoán cụ thể và đọc symptom thoáng qua qua lăng kính đó. Stem mô tả ngược — An KHÔNG kết luận gì, anh chỉ order thêm test để loại trừ rare risk. Open belief + extra test ≠ biased interpretation."
      B: "Motivated reasoning yêu cầu motive cá nhân để đi đến kết luận. Bác sĩ không có motive 'muốn bệnh nhân bị aneurysm' — ngược lại, anh muốn loại trừ. Lo lắng nghề nghiệp về miss rare case là calibrated risk management, không phải motivated reasoning."
      C: "Cherry-picking đòi hỏi chọn evidence confirming và bỏ disconfirming. An KHÔNG bỏ qua 99% case lành tính — anh thừa nhận rõ '99% lành tính' và nói lý do vẫn order là vì asymmetric cost của 1% còn lại. Đó là calculus về Bayesian risk, không phải cherry-pick."

  - q_id: q27
    stem: "Một post viral trên Threads: 'Sếp Gen Z toàn vô lý, không có năng lực'. Vinh 35 tuổi, làm IT 10 năm, đọc và gật đầu. Vinh chỉ nhớ 2 trải nghiệm sếp Gen Z dở trong 5 năm qua, quên 3 sếp Gen Z giỏi. Vinh share post với caption 'đồng ý 100%'. Trong 200 reply, 50 người đồng tình — Vinh xem reply và nghĩ 'cả Threads đang đồng ý, chắc là sự thật'. Vinh mắc lỗi nghiêm trọng nhất là gì?"
    type_tested: "echo chamber reinforcement"
    situation: "social media (Threads/FB drama, viral post, comment thread, group dynamic)"
    options:
      A: "Cherry-picking evidence — Vinh nhớ 2 sếp dở, quên 3 sếp giỏi để justify."
      B: "Echo chamber reinforcement — Vinh đếm 50 người đồng tình trong 200 reply (bỏ qua 150 không đồng tình hoặc silent) và framing 'cả Threads đồng ý' để củng cố niềm tin; môi trường xã hội đang feed lại đúng cái Vinh đã tin, mỗi reply đồng tình trở thành Stage 1 input cho lần sau."
      C: "Không có lỗi gì — 50 người đồng ý là social proof valid, Vinh có lý do tin theo."
      D: "Appeal to popularity — 'cả Threads đồng ý nên đúng' là dựa vào số đông để chứng minh."
    correct: B
    explanation: "Đây là echo chamber reinforcement điển hình — chìa khoá là cụm 'cả Threads đang đồng ý'. Vinh đã làm hai bước rất rõ — (1) tự build môi trường xã hội đồng quan điểm bằng cách share + caption khẳng định (tự đẩy Stage 1 cho lần sau), (2) đếm 50 reply đồng tình và FRAMING là 'cả Threads', dù trong 200 reply chỉ 50 đồng (25%), 150 còn lại có thể không đồng hoặc silent. Cherry-pick về trí nhớ cá nhân (2 vs 3 sếp) là phần phụ; nhân tố chi phối là echo chamber social — chính là điểm khác giữa CB cá nhân và CB nhóm."
    distractor_explanations:
      A: "Cherry-pick về 2 sếp dở vs 3 sếp giỏi có hiện diện, nhưng đó chỉ là phần nội tâm; phần lớn hơn là Vinh tự build echo chamber bằng cách share + đếm reply đồng tình. Echo chamber bao trùm cherry-pick trong câu chuyện này."
      C: "50 reply đồng tình KHÔNG phải social proof valid khi mẫu bị self-select. Người không đồng ý thường im lặng hoặc scroll qua. Vinh đếm 50 đồng và framing 'cả Threads' là chính xác cơ chế tạo ảo giác đồng thuận trong echo chamber."
      D: "Appeal to popularity là một fallacy logic chung ('nhiều người tin nên đúng'). Echo chamber reinforcement là variant cụ thể trong khung confirmation bias — bài học đang dạy 6 sub-type CB, và echo chamber là tên chính xác cho hành vi tự build môi trường đồng quan điểm + lấy đó làm chứng cứ. Gọi 'appeal to popularity' là ra khỏi khung CB và bỏ mất phần 'self-build môi trường' đặc trưng."
