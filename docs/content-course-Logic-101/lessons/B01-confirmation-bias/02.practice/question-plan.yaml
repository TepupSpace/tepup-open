      - q_id: q23
        stem_draft: "Chị Yến 38 tuổi, không đi khám định kỳ 5 năm vì 'tôi cảm thấy khoẻ, gia đình không ai bị bệnh nặng'. Khi bạn nhắc 'nhiều bệnh ung thư giai đoạn đầu không triệu chứng', Yến đáp 'nhưng nhà tôi gen tốt — bà tôi sống 90 tuổi. Nếu có bệnh tôi đã cảm thấy rồi. Hơn nữa tôi không có thời gian'. Yến mắc lỗi nghiêm trọng nhất là gì?"
        type_tested: "motivated reasoning"
        situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
        distractor_pattern: ["near-miss: biased interpretation", "no-bias: 'medical autonomy của individual'", "unrelated: appeal to nature"]

      - q_id: q24
        stem_draft: "Bạn Phương nói 'cung hoàng đạo có lý — bạn thân tôi là Scorpio, rất sâu sắc. Anh sếp tôi Scorpio, cũng rất đam mê. Tôi follow 3 KOL Scorpio, ai cũng huyền bí. Đó là 5 Scorpio đáng tin'. Khi bạn hỏi 'thế còn 10 Scorpio khác bạn quen mà không như thế?', Phương đáp 'họ là exception, không tiêu biểu'. Phương mắc lỗi nghiêm trọng nhất là gì?"
        type_tested: "cherry-picking evidence"
        situation: "đời thường (cung hoàng đạo, đội bóng, tribe tech iPhone/Android, mê tín dị đoan)"
        ref_citation_id: v4
        distractor_pattern: ["near-miss: biased interpretation (cũng có vì 'sâu sắc/huyền bí' là interpretation, nhưng cherry-pick nổi hơn vì hành vi chọn 5 bỏ 10)", "no-bias: 'observation từ kinh nghiệm là valid'", "unrelated: hasty generalization (cũng có thể đúng nhưng cherry-pick là confirmation bias variant rõ hơn)"]

      - q_id: q25
        stem_draft: "Sếp Tâm tin nhân viên Huy là top performer. Cuối quý, data cho thấy Huy chỉ ở mức average — completion rate 65%, đồng nghiệp ngang hàng đạt 75-80%. Tâm đọc data, ngạc nhiên, tự nói 'có lẽ tôi đã bias vì Huy nói chuyện confident'. Tâm xin meeting với HR để hỏi rubric, đọc thêm performance report của 5 nhân viên khác, và update đánh giá Huy từ 'top' xuống 'average'. Tâm đang mắc confirmation bias?"
        type_tested: "biased interpretation"
        situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
        notes: "EDGE CASE 1 — rational belief update. correct answer = 'KHÔNG, đây là rational update sau khi gặp evidence rõ ràng. Confirmation bias = giữ niềm tin BẤT CHẤP evidence; Tâm thì update belief THEO evidence.'"
        distractor_pattern: ["near-miss: 'biased interpretation' (nếu chọn này = không hiểu khác biệt giữa belief update và bias)", "near-miss: 'belief perseverance' (ngược lại — không có perseverance vì đã update)", "unrelated: 'motivated reasoning'"]

      - q_id: q26
        stem_draft: "Bác sĩ An khám bệnh nhân Nga, 35 tuổi, triệu chứng đau đầu thoáng qua. Khám lâm sàng bình thường. Theo guideline, đa số case như này không cần MRI. Nhưng An vẫn order MRI vì 'tôi biết symptom thoáng qua + tuổi 35 + giới nữ có rủi ro nhỏ về aneurysm; thà order extra test mà 99% lành tính còn hơn miss 1% case'. An đang mắc confirmation bias (cố tìm bằng chứng để confirm chẩn đoán hiểm)?"
        type_tested: "biased interpretation"
        situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
        notes: "EDGE CASE 2 — skeptical priors / appropriate Bayesian caution. correct answer = 'KHÔNG, đây là calibrated skepticism với evidence khách quan, không phải bias. Bác sĩ KHÔNG tin trước rồi tìm bằng chứng — bác sĩ chỉ HEDGING với prior knowledge về rare risk. Confirmation bias yêu cầu starting belief + filtering; ở đây bác sĩ open belief.'"
