        situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
        ref_citation_id: c4
        distractor_pattern: ["near-miss: cherry-picking evidence (cả 2 dùng cùng data, khác là interpretation)", "no-bias: 'manager subjective judgment is necessary'", "unrelated: motivated reasoning"]

