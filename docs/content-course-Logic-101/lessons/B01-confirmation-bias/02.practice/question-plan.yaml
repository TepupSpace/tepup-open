        stem_draft: "Anh Khoa mua 1 cổ phiếu midcap, hold 18 tháng, giảm 60%. Earnings report 4 quý gần nhất đều miss. Bạn Khoa nói 'cắt lỗ đi, doanh nghiệp đang đi xuống thật sự'. Khoa đọc earnings report kỹ và nhận xét 'gross margin có giảm nhưng tôi thấy management vẫn nói tích cực về long-term — họ có vision'. Khoa hold thêm 6 tháng nữa, giảm thêm 20%. Khoa mắc lỗi nghiêm trọng nhất là gì?"
