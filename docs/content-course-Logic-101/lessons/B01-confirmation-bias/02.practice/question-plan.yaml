  - level: hard
    questions:
      - q_id: q21
        stem_draft: "Anh Đạt review nhân viên Lan. Trong 12 tháng qua, Lan có 8 dự án — 6 thành công, 2 fail. Đạt vốn nghĩ Lan tốt. Khi đọc kết quả, Đạt diễn giải 6 thành công là 'chứng tỏ năng lực', 2 fail là 'bad luck, không phải lỗi Lan'. Đồng nghiệp Tâm review cùng Lan, vốn nghĩ Lan trung bình, diễn giải ngược lại: 6 thành công là 'lucky đơn giản', 2 fail là 'chứng tỏ judgement yếu'. Đạt và Tâm đều mắc lỗi gì giống nhau?"
