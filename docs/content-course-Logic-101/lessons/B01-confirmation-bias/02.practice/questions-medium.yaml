---
tier: medium
questions:
  - q_id: q11
    stem: "Quang follow một crypto influencer 50K followers, mỗi tuần đăng 'BTC sắp 200K'. Khi đọc bài bear thesis từ một fund manager, Quang nghĩ 'thằng này short BTC, chắc cố tình FUD' và lướt nhanh. Bài bull thì đọc kỹ 10 phút. Quang tự nhủ 'tôi đã research kỹ cả 2 phía, không bias đâu'. Quang đang mắc lỗi gì rõ nhất?"
    type_tested: "selective attention / selective exposure"
    situation: "đầu tư / tiền (crypto, stock, scheme, MMO)"
    options:
      A: "Ad hominem — Quang công kích danh tính fund manager ('thằng này short') thay vì phản biện luận điểm."
      B: "Motivated reasoning — Quang xây lập luận 'thằng này short BTC' để bảo vệ kết luận đã muốn từ trước."
      C: "Selective attention / selective exposure — trong cùng một dòng thông tin, Quang dừng đọc kỹ bài khớp niềm tin và lướt nhanh bài ngược chiều, dù tự tin là 'đã research kỹ cả 2 phía'."
      D: "Không có lỗi gì — Quang đã đọc cả 2 phía, đó là due diligence hợp lý cho nhà đầu tư."
    correct: C
    explanation: "Đây là selective attention ở stage Input — cue cảm xúc là cảm giác 'vindication' khi Quang gán nhãn fund manager là 'FUD' để có lý do lướt nhanh. Dù cùng đọc cả 2 nguồn, thời gian dừng (10 phút bull vs lướt bear) cho thấy não đang lọc. Câu 'tôi đã research kỹ' chính là dấu hiệu System 2 chưa được gọi — illusion of due diligence."
    distractor_explanations:
      A: "Ad hominem yêu cầu công kích người để bác luận điểm trong tranh luận với người đó. Ở đây Quang chỉ tự nhủ trong đầu để có cớ lướt, không tranh luận với fund manager — vấn đề là cách lọc input, không phải hình thức argument."
      B: "Motivated reasoning gần đúng — Quang có xây lý lẽ ('thằng này short') — nhưng cơ chế cốt lõi là hành vi chọn lọc thời gian đọc giữa 2 nguồn (Input stage), nên selective attention sát hơn."
      D: "Đọc cả 2 phía mà time-on-page chênh lệch 10 phút vs vài giây không phải due diligence. Áp 2-trigger filter: stake cao (tiền đầu tư) × khớp ngọt ('không bias đâu' tự đắc) → đây là cờ đỏ, không phải reasoning bình thường."
    ref_citation_id: v2

  - q_id: q12
    stem: "Hà thử intermittent fasting 3 tháng, giảm 5kg. Cô khẳng định 'IF chắc chắn hiệu quả'. Khi đồng nghiệp hỏi 'em có thay đổi gì khác không?', Hà thừa nhận 'à có, em cũng bỏ trà sữa và đi bộ 30 phút mỗi tối — nhưng cái đó là cộng thêm thôi, chính là IF tạo ra khác biệt'. Hà đang mắc lỗi gì rõ nhất?"
    type_tested: "cherry-picking evidence"
    situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
    options:
      A: "Cherry-picking evidence — trong 3 biến số đồng thời thay đổi (IF + bỏ trà sữa + đi bộ), Hà chọn IF làm bằng chứng đại diện và downweight 2 biến còn lại."
      B: "Không có lỗi gì — 5kg giảm là evidence rõ ràng, Hà có quyền đánh giá phương pháp nào hiệu quả với mình."
      C: "Biased interpretation — Hà đang diễn giải dữ liệu mơ hồ theo hướng có lợi."
      D: "False dilemma — Hà đang giả định chỉ có 2 lựa chọn: IF hoặc không."
    correct: A
    explanation: "Đây là cherry-picking — cue cảm xúc là cảm giác 'validation' khi Hà đã trả 3 tháng cho IF và muốn coi đó là quyết định đúng. Trong 3 nguyên nhân khả dĩ cho 5kg giảm (deficit calo từ IF, bỏ trà sữa = bớt ~500 cal/ngày, đi bộ = burn calo), Hà chọn duy nhất IF làm 'chính'. Não chỉ thấy bằng chứng confirming, bỏ qua câu hỏi 'mẫu thử có đại diện không?'."
    distractor_explanations:
      B: "5kg là kết quả, không phải bằng chứng cho nguyên nhân nào. Áp 2-trigger filter: stake cao (sức khoẻ + decision tiếp tục IF) × khớp ngọt ('IF chắc chắn hiệu quả' không có chút cấn nào dù có 3 biến đồng thời) — đây là cờ đỏ, không phải 'evidence rõ ràng'."
      C: "Biased interpretation là cùng một thông tin diễn giải theo niềm tin. Ở đây không có thông tin mơ hồ — có 3 biến rõ ràng, Hà chọn 1 và downweight 2 cái khác. Đó là hành vi chọn lọc bằng chứng (cherry-pick), không phải diễn giải."
      D: "False dilemma là ép buộc chỉ 2 lựa chọn loại trừ nhau. Hà không nói 'IF hoặc không có gì' — cô thừa nhận 3 yếu tố, chỉ là gán trọng số sai. Khác zone."

  - q_id: q13
    stem: "Khang đọc Threads, thấy 1 post viral 'thế hệ trẻ giờ lười, không chịu khó như bố mẹ'. Khang là Gen Z, đọc xong tức và viết bài counter dài 500 chữ. Khi bạn hỏi 'sao mày tin post đó nói về cả thế hệ?', Khang đáp 'tôi không tin post đó — tôi viết để phản biện thôi'. Nhưng Khang đã đọc kỹ 3 lần và soạn reply trong 2 tiếng, trong khi ban đầu chỉ định lướt. Khang đang mắc lỗi gì rõ nhất?"
    type_tested: "motivated reasoning"
    situation: "social media (Threads/FB drama, viral post, comment thread, group dynamic)"
    options:
      A: "Strawman — Khang đang xuyên tạc luận điểm của post viral để dễ counter."
      B: "Motivated reasoning — Khang muốn cảm thấy 'thế hệ tôi không lười' từ trước, rồi xây lý lẽ 'tôi chỉ phản biện thôi' để justify việc dành 2 tiếng engage với post mà ban đầu chỉ định lướt."
      C: "Không có lỗi gì — phản biện một post sai là healthy debate, không phải bias."
      D: "Biased interpretation — Khang đang đọc post theo cách lệch để có cớ phản biện."
    correct: B
    explanation: "Đây là motivated reasoning — cue cảm xúc rõ nhất là 'tức' đầu stem, đó là dấu hiệu kết luận đã hình thành trước khi reasoning bắt đầu. Khang muốn bảo vệ thế hệ mình (kết luận muốn đi tới) rồi xây lý lẽ 'tôi viết để phản biện thôi' để justify hành vi (2 tiếng engage một post ban đầu định lướt). Khang thật sự tin lý lẽ của mình — đó là điểm tinh tế của motivated reasoning, không phải nói dối."
    distractor_explanations:
      A: "Strawman là xuyên tạc luận điểm đối thủ thành phiên bản dễ counter hơn. Stem không nói Khang xuyên tạc post — chỉ nói anh engage rất sâu. Vấn đề là động cơ engage, không phải hình thức argument."
      C: "Phản biện healthy có cấu trúc 'engage with strongest version of argument'. Ở đây cue 'tức' + thay đổi hành vi (lướt → 2 tiếng) cho thấy emotion-driven, không phải reason-driven. Áp 2-trigger filter: stake (danh tính thế hệ) × khớp ngọt (lý do 'tôi chỉ phản biện thôi' nghe quá smooth) — cờ đỏ."
      D: "Biased interpretation cần Khang đọc post theo cách lệch. Stem không nói Khang đọc lệch — anh đọc đúng câu chữ. Vấn đề là vì sao anh dành 2 tiếng cho nó (động cơ), nên motivated reasoning rõ hơn."

  - q_id: q14
    stem: "Mai dạy con đọc sách từ 18 tháng tuổi, tin 'phương pháp này tạo ra thiên tài'. Sau 2 năm, con cô không tiến bộ vượt trội so với bạn cùng lớp. Khi bạn bè gợi ý 'có thể phương pháp này không phù hợp cho con em', Mai đáp 'không, chắc do em chưa làm đủ kỷ luật — tuần tới em sẽ làm 2 tiếng/ngày thay vì 1 tiếng'. Mai đang mắc lỗi gì rõ nhất?"
    type_tested: "belief perseverance"
    situation: "education / parenting (con học sớm, song ngữ, skill training, learning style myth)"
    options:
      A: "Appeal to tradition — Mai dựa vào phương pháp truyền thống để justify."
      B: "Không có lỗi gì — consistency in parenting là tốt, không thể đổi phương pháp mỗi 2 năm."
      C: "Motivated reasoning — Mai xây lý lẽ 'chưa đủ kỷ luật' để justify."
      D: "Belief perseverance — sau 2 năm bằng chứng (con không tiến bộ vượt trội) đã có, Mai vẫn giữ niềm tin gốc và đổ lỗi cho dose thấp, không xét lại giả thuyết."
    correct: D
    explanation: "Đây là belief perseverance ở stage Output — cue cảm xúc là cảm giác 'vindication' khi Mai tìm được cách diễn giải giữ nguyên niềm tin (chưa đủ kỷ luật → tăng dose). Bằng chứng ngược chiều đã có 2 năm, nhưng Mai không update giả thuyết 'phương pháp này tạo thiên tài' — cô update biến phụ (dose 1h → 2h) để bảo vệ giả thuyết gốc. Pattern điển hình: niềm tin không yếu đi mà mạnh hơn khi gặp evidence ngược."
    distractor_explanations:
      A: "Appeal to tradition là 'cứ làm vì xưa nay vẫn làm thế'. Mai không viện dẫn truyền thống — cô tin một phương pháp cụ thể vì kỳ vọng kết quả. Khác zone."
      B: "Consistency tốt khi phương pháp có evidence base. Ở đây evidence (2 năm + con không vượt trội) đang ngược với giả thuyết. Áp 2-trigger filter: stake cao (sự phát triển của con) × khớp ngọt ('tăng dose là đủ') — đây là cờ đỏ, không phải consistency hợp lý."
      C: "Motivated reasoning gần đúng — Mai có xây lý lẽ 'chưa đủ kỷ luật' — nhưng cơ chế cốt lõi là việc giữ niềm tin BẤT CHẤP 2 năm evidence ngược, kèm theo update biến phụ để bảo vệ niềm tin gốc. Đó là belief perseverance signature, một bước sâu hơn motivated reasoning."

  - q_id: q15
    stem: "Trong team product, dev Tâm tin 'PM không hiểu kỹ thuật'. Mỗi lần PM Linh đưa idea, Tâm chỉ nhớ lần Linh sai về tech detail, quên lần Linh đúng. Tâm chỉ chat với 3 dev khác cùng team (đều đồng tình); những dev có view khác Tâm không nói chuyện. Tâm chốt với bạn ngoài team 'mọi dev trong team đều thấy PM ta yếu'. Tâm đang mắc lỗi gì rõ nhất?"
    type_tested: "echo chamber reinforcement"
    situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
    options:
      A: "Biased interpretation — Tâm đang diễn giải hành vi của PM theo niềm tin có sẵn."
      B: "Echo chamber reinforcement — Tâm đã filter social network (chỉ 3 dev đồng tình, né dev khác view), tạo ảo giác 'mọi dev đều thấy' và dùng nó làm bằng chứng."
      C: "Không có lỗi gì — feedback từ 3 dev là valid signal về chất lượng PM."
      D: "Ad hominem — Tâm đang công kích danh tính PM thay vì critique idea cụ thể."
    correct: B
    explanation: "Đây là echo chamber ở stage Output — cue cảm xúc là cảm giác 'vindication' khi Tâm có 3 đồng minh đồng tình, củng cố 'mọi dev đều thấy'. Cơ chế cốt lõi là filter môi trường xã hội (chỉ chat với 3 dev đồng tình, né dev khác view), tạo social proof ảo. Mỗi dev trong nhóm 3 đó trở thành Input cho Tâm, Tâm trở thành Input cho họ — loop tự củng cố ở quy mô micro-community."
    distractor_explanations:
      A: "Biased interpretation có xuất hiện trong stem (Tâm nhớ Linh sai, quên Linh đúng), nhưng câu cuối 'mọi dev trong team đều thấy' nhấn vào dynamic social — đó là echo chamber rõ hơn. Hai cơ chế cùng chạy, echo chamber là cơ chế nổi."
      C: "3 dev cùng quan điểm trong khi né dev khác view không phải sample representative — đó là sample đã bias. Áp 2-trigger filter: stake (đánh giá đồng nghiệp ảnh hưởng team dynamic) × khớp ngọt ('mọi dev đều thấy' nghe rất rõ ràng) — cờ đỏ."
      D: "Ad hominem yêu cầu attack vào người để bác argument cụ thể trong tranh luận. Stem không có tranh luận trực tiếp giữa Tâm và PM Linh — Tâm chỉ form belief về PM nói chung. Khác zone."

  - q_id: q16
    stem: "Sang uống multivitamin 3 tháng, ít ốm hơn so với 3 tháng trước. Anh share trên Threads 'multivitamin đã thay đổi cuộc đời tôi'. Comment hỏi 'anh có thay đổi gì khác không?' — Sang đáp 'à có, tôi bắt đầu tập gym 3 buổi/tuần và ngủ trước 11h cùng đợt. Nhưng tôi tin chính multivitamin tạo khác biệt — gym và ngủ chỉ phụ thôi'. Sang đang mắc lỗi gì rõ nhất?"
    type_tested: "motivated reasoning"
    situation: "sức khoẻ / diet (detox, IF, supplement, fitness routine)"
    options:
      A: "Hasty generalization — Sang kết luận từ mẫu quá nhỏ (1 case bản thân)."
      B: "Cherry-picking evidence — Sang chọn multivitamin làm bằng chứng và bỏ qua gym + ngủ."
      C: "Motivated reasoning — Sang đã muốn tin multivitamin từ trước (đã chi tiền 3 tháng + đã share rồi), rồi xây lý lẽ 'gym và ngủ chỉ phụ thôi' để bảo vệ kết luận."
      D: "Không có lỗi gì — Sang đã thừa nhận 3 yếu tố, đó là transparent reasoning."
    correct: C
    explanation: "Đây là motivated reasoning — cue cảm xúc là 'validation' sau khi đã share công khai 'multivitamin thay đổi cuộc đời'. Khác câu q12 (Hà còn đang đánh giá trong đầu), Sang đã commit public và có động cơ rõ ràng để bảo vệ multivitamin. Khi bị challenge bằng 2 confounding variable, Sang không update belief, mà chủ động xây lý lẽ phân hạng ('chính' vs 'phụ') để giữ kết luận. Đây là pattern 'kết luận muốn đi → xây justification' của Kunda."
    distractor_explanations:
      A: "Hasty generalization là kết luận universal từ sample nhỏ. Sang chỉ nói về bản thân ('cuộc đời tôi'), không generalize cho người khác. Khác zone."
      B: "Cherry-picking gần đúng — Sang có chọn 1 yếu tố làm chính. Nhưng cherry-pick thường vô thức (Hà q12); ở đây Sang BIẾT có 3 yếu tố và chủ động phân hạng để bảo vệ kết luận đã share — đó là motivated reasoning (có động cơ social: đã share rồi, không muốn sai)."
      D: "Thừa nhận 3 yếu tố rồi vẫn gán trọng số sai (không có evidence nào nói gym + ngủ là 'phụ') không phải transparent. Áp 2-trigger filter: stake (uy tín đã share) × khớp ngọt (lý do 'tôi tin chính multivitamin') — cờ đỏ."

  - q_id: q17
    stem: "Cô giáo Yến nói với bạn 'con tôi mới 4 tuổi đọc được 200 từ rồi'. Bạn cô đáp 'nhưng nghiên cứu cho thấy 70% trẻ đọc sớm không có lợi thế đến lớp 3'. Yến đọc và nghĩ 'à, vậy là con tôi nằm trong 30% còn lại, chứng tỏ con tôi đặc biệt'. Yến đang mắc lỗi gì rõ nhất?"
    type_tested: "biased interpretation"
    situation: "education / parenting (con học sớm, song ngữ, skill training, learning style myth)"
    options:
      A: "Cherry-picking evidence — Yến chỉ chọn phần 30% và bỏ qua phần 70%."
      B: "Biased interpretation — cùng một số liệu (70/30), Yến diễn giải lệch theo niềm tin có sẵn ('con tôi đặc biệt') và biến bằng chứng phủ định thành bằng chứng confirming."
      C: "Không có lỗi gì — parent có quyền tin con mình thuộc nhóm 30%, đó là optimism hợp lý."
      D: "False dilemma — Yến đang ép buộc chỉ 2 lựa chọn: con thuộc 70% hoặc 30%."
    correct: B
    explanation: "Đây là biased interpretation kinh điển — cue cảm xúc là 'vindication' khi Yến tìm được cách quay thông tin ngược chiều thành thông tin ủng hộ. Cùng một số liệu nhưng Yến tự assume con mình thuộc 30% (không có lý do gì để giả định vậy hơn 70%) và dùng đó làm 'chứng tỏ' niềm tin có sẵn. Đây là pattern Lord-Ross-Lepper 1979: đọc cùng bằng chứng, niềm tin càng cứng hơn, không ôn hoà hơn."
    distractor_explanations:
      A: "Cherry-picking là chọn evidence cụ thể trong tập dữ liệu. Ở đây Yến không bỏ qua 70% — cô diễn giải lại 70/30 theo cách quay 30 thành 'của tôi'. Đó là biased interpretation (xử lý dữ liệu), không phải chọn lọc dữ liệu."
      C: "Optimism không phải lỗi tự thân; lỗi nằm ở việc dùng dữ liệu phủ định làm dữ liệu xác nhận mà không có cơ sở. Áp 2-trigger filter: stake (decision tiếp tục dạy con đọc sớm) × khớp ngọt ('con tôi đặc biệt' không có một chút 'ơ nhưng mà' nào) — cờ đỏ."
      D: "False dilemma là ép buộc 2 lựa chọn loại trừ nhau. Số liệu 70/30 thực sự chỉ có 2 nhóm — đó là dữ liệu, không phải dilemma do Yến ép. Vấn đề là cách diễn giải nhóm 30, không phải cấu trúc 2 nhóm."
    ref_citation_id: c4

  - q_id: q18
    stem: "Hương đầu tư 200 triệu vào 1 'chương trình MMO' hứa 30%/tháng. Sau 6 tháng, chương trình đóng cửa, mất tiền. Bạn cô nói 'rõ ràng là Ponzi mà, các dấu hiệu đầy ra'. Hương đáp 'không, là vì điều kiện thị trường, founder thực sự có tâm. Tôi sẽ thử chương trình tương tự khác'. Hương đang mắc lỗi gì rõ nhất?"
    type_tested: "belief perseverance"
    situation: "đầu tư / tiền (crypto, stock, scheme, MMO)"
    options:
      A: "Gambler's fallacy — Hương tin chương trình sau sẽ khác chương trình trước."
      B: "Belief perseverance — đã mất 200 triệu (evidence không thể rõ hơn), Hương vẫn giữ niềm tin 'founder có tâm' và đổ lỗi cho biến ngoại sinh (thị trường), tiếp tục lặp lại quyết định cùng pattern."
      C: "Motivated reasoning — Hương xây lý lẽ 'điều kiện thị trường' để justify quyết định."
      D: "Không có lỗi gì — investor optimism cần thiết, ai cũng có lần thua."
    correct: B
    explanation: "Đây là belief perseverance level cao nhất ở stage Output — cue cảm xúc là 'denial' cộng 'vindication' khi Hương tìm được cách giữ nguyên niềm tin về scheme dù đã mất 200 triệu. Bằng chứng ngược không thể rõ hơn (đóng cửa + mất 100% vốn), nhưng Hương vẫn không update model 'chương trình MMO 30%/tháng có thể tin được' — cô update biến phụ ('điều kiện thị trường') để bảo vệ giả thuyết gốc, rồi định lặp lại pattern."
    distractor_explanations:
      A: "Gambler's fallacy là 'sau nhiều thua sẽ thắng vì xác suất'. Hương không lập luận về xác suất — cô tin vào 'founder có tâm', không phải 'tới lượt thắng'. Khác zone."
      C: "Motivated reasoning có xuất hiện ('điều kiện thị trường' là justification), nhưng đó chỉ là một biểu hiện. Cơ chế nổi hơn là việc niềm tin tồn tại dai dẳng sau khi evidence (mất 200 triệu) đã bác bỏ rõ ràng, kèm hành vi lặp lại pattern — đó là belief perseverance signature."
      D: "Investor optimism healthy có cấu trúc 'update model sau loss'. Hương đang làm ngược: không update model, lặp lại quyết định. Áp 2-trigger filter: stake (vốn tiếp theo) × khớp ngọt ('founder có tâm' không có một chút 'ơ nhưng mà') — cờ đỏ tối đa."
    ref_citation_id: v3

  - q_id: q19
    stem: "Tú tin 'con tôi là kinetic learner — phải học qua vận động'. Khi giáo viên đưa 5 nghiên cứu meta-analysis nói 'learning styles là myth khoa học', Tú đáp 'tôi đọc 1 cuốn sách 10 năm trước nói learning styles có thật. Hơn nữa, tôi từng thấy con học toán qua dance hiệu quả hơn 1 lần'. Tú đang mắc lỗi gì rõ nhất?"
    type_tested: "cherry-picking evidence"
    situation: "education / parenting (con học sớm, song ngữ, skill training, learning style myth)"
    options:
      A: "Cherry-picking evidence — đối diện 5 meta-analysis, Tú chọn 1 cuốn sách 10 năm trước + 1 quan sát cá nhân làm bằng chứng đại diện, bỏ qua chênh lệch về chất lượng và khối lượng bằng chứng."
      B: "Không có lỗi gì — parent quan sát con thường xuyên có insight tốt hơn nghiên cứu chung."
      C: "Belief perseverance — Tú giữ niềm tin dai dẳng sau khi evidence ngược chiều đã có."
      D: "Appeal to nature — Tú đang viện dẫn cái gì tự nhiên là tốt."
    correct: A
    explanation: "Đây là cherry-picking — cue cảm xúc là 'validation' khi Tú lập tức tìm được counter-evidence (sách 10 năm trước + 1 lần quan sát) để bảo vệ niềm tin. Cơ chế cốt lõi là chọn lọc bằng chứng theo trọng số đảo ngược: 5 meta-analysis (sample khổng lồ, chất lượng cao, mới) bị downweight; 1 cuốn sách cũ + 1 anecdote (sample n=1, không control) được upweight. Pattern điển hình: não chỉ thấy evidence confirming."
    distractor_explanations:
      B: "Parental observation có giá trị, nhưng đặt n=1 anecdote ngang 5 meta-analysis không phải insight tốt hơn — đó là chọn lọc bằng chứng. Áp 2-trigger filter: stake (cách giáo dục con) × khớp ngọt ('tôi từng thấy 1 lần' nghe quá dễ tin với người đã có belief) — cờ đỏ."
      C: "Belief perseverance gần đúng — Tú có giữ niềm tin sau evidence ngược. Nhưng hành vi cụ thể là chọn evidence khác để counter, không phải đổ lỗi cho biến phụ hay từ chối engage. Cherry-pick (chọn evidence confirming) là cơ chế nổi hơn."
      D: "Appeal to nature là 'cái gì tự nhiên thì tốt'. Tú không nói gì về tự nhiên — chỉ chọn evidence theo niềm tin. Khác zone."

  - q_id: q20
    stem: "Sếp Hoa đánh giá cao nhân viên Linh. Mỗi cuộc họp, Hoa chỉ chú ý tới khoảnh khắc Linh nói thông minh, không để ý lúc Linh im lặng hay nói nhầm. Khi review performance, Hoa hỏi 3 manager khác — đều là bạn thân hay đồng tình với Hoa — và kết luận 'cả team manager đều thấy Linh sáng giá'. Hoa đang mắc lỗi gì rõ nhất?"
    type_tested: "selective attention / selective exposure"
    situation: "workplace / career (boss, đồng nghiệp, career path myth, evaluation bias)"
    options:
      A: "Hasty generalization — Hoa kết luận về Linh từ vài khoảnh khắc trong họp."
      B: "Không có lỗi gì — manager có kinh nghiệm có instinct đúng về talent."
      C: "Echo chamber reinforcement — Hoa dựa vào 3 manager đồng tình để xác nhận belief."
      D: "Selective attention / selective exposure — Hoa lọc ngay từ Input: chú ý moment Linh nói thông minh, bỏ qua moment trung tính; rồi cũng tự chọn 3 manager đồng tình làm nguồn validate."
    correct: D
    explanation: "Đây là selective attention ở stage Input ở 2 cấp độ — cue cảm xúc là sự thoải mái khi Hoa đã có belief 'Linh sáng giá' và mọi observation tiếp theo đều ăn khớp. Cấp 1: trong cùng cuộc họp, Hoa chú ý có chọn lọc thời điểm Linh shine, bỏ qua thời điểm trung tính/yếu. Cấp 2: chọn nguồn validate là 3 manager đồng tình, không phải 3 manager neutral. Cả 2 cấp đều là Input lọc, đó là gốc của loop trước khi đến processing."
    distractor_explanations:
      A: "Hasty generalization là kết luận universal từ sample nhỏ. Hoa không nói 'mọi nhân viên Z đều giỏi như Linh' — cô nói về Linh cụ thể. Vấn đề là cách thu thập observation về Linh, không phải nhảy từ sample → universal."
      B: "Manager instinct không phải free pass nếu instinct được xây trên input đã lọc. Áp 2-trigger filter: stake cao (performance review ảnh hưởng career Linh + ngân sách thưởng) × khớp ngọt ('cả team manager đều thấy' nghe quá rõ ràng dù 3 trong 3 là bạn thân) — cờ đỏ."
      C: "Echo chamber gần đúng — Hoa có chọn 3 manager đồng tình. Nhưng câu hỏi nhấn vào cả Input cá nhân (cuộc họp) + chọn nguồn validate, không chỉ social filter. Selective attention rộng hơn và bao trùm cả 2 cấp — đó là cơ chế nổi nhất. Nếu chỉ có phần 'hỏi 3 manager' thì echo chamber sát hơn."
