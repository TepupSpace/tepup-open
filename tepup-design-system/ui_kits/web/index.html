<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tepup Web UI Kit</title>
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    @keyframes tepup-ping     { 0%   { transform:translateX(-50%) scale(0.85); opacity:.45 }
                                80%,100%{ transform:translateX(-50%) scale(1.45); opacity:0 } }
    @keyframes tepup-slide-up { from { opacity:0; transform:translate(-50%, 100%) }
                                to   { opacity:1; transform:translate(-50%, 0) } }
    @keyframes tepup-fade-in  { from { opacity:0; transform:translateY(10px) }
                                to   { opacity:1; transform:translateY(0) } }
    html { scroll-behavior:smooth; }
    button:focus-visible, a:focus-visible {
      outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:8px;
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [route, setRoute] = useState({ name: 'home' });
      const navigate = (name, props = {}) => setRoute({ name, ...props });

      let screen;
      if (route.name === 'home')         screen = <HomeScreen        data={WEB_DATA} navigate={navigate} />;
      else if (route.name === 'courses') screen = <CoursesScreen     data={WEB_DATA} navigate={navigate} />;
      else if (route.name === 'course')  screen = <CourseDetailScreen data={WEB_DATA} navigate={navigate} />;
      else if (route.name === 'lesson')  screen = <LessonReaderScreen data={WEB_DATA} navigate={navigate} />;
      else                                screen = <HomeScreen        data={WEB_DATA} navigate={navigate} />;

      return screen;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
