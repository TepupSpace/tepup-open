<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tepup Admin UI Kit</title>
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html { scroll-behavior:smooth; }
    button:focus-visible, a:focus-visible {
      outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:8px;
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="../web/icons.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const TITLES = {
      dashboard:'Dashboard', reviews:'Duyệt nội dung', categories:'Danh mục',
      courses:'Khóa học', lessons:'Bài học', library:'Thư viện',
      characters:'Nhân vật', stories:'Câu chuyện', users:'Người dùng',
      'feature-requests':'Yêu cầu tính năng',
    };

    function App() {
      const [route, setRoute] = useState('dashboard');
      const data = ADMIN_DATA;
      const title = `Quản trị Tepup · ${TITLES[route] || route}`;
      let body;
      if (route === 'dashboard')      body = <DashboardScreen data={data} navigate={setRoute} />;
      else if (route === 'reviews')   body = <ReviewsScreen   data={data} />;
      else if (route === 'courses')   body = <CoursesScreen   data={data} />;
      else                            body = <PlaceholderScreen title={TITLES[route] || route} />;
      return (
        <AdminLayout active={route} onNav={setRoute} title={title} user={data.user}>
          {body}
        </AdminLayout>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
