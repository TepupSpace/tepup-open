<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:24px;min-height:190px;justify-content:center;align-items:center;gap:32px;flex-direction:row">
  <style>@keyframes ping{0%{transform:scale(0.9);opacity:0.45}80%,100%{transform:scale(1.4);opacity:0}}
    .ring{position:absolute;inset:-8px;border:2px solid var(--blue-400);border-radius:9999px;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}</style>

  <!-- Completed -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;border-radius:9999px;background:var(--green-500);color:#fff;display:flex;align-items:center;justify-content:center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <span class="t-meta" style="color:var(--fg-2);font-weight:500">Đã hoàn thành</span>
  </div>

  <!-- Current (active ring) -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="position:relative;width:64px;height:64px;border-radius:9999px;background:#fff;border:4px solid var(--blue-500);box-shadow:var(--shadow-blue);display:flex;align-items:center;justify-content:center">
      <div style="width:14px;height:14px;border-radius:9999px;background:var(--blue-500)"></div>
      <div class="ring"></div>
    </div>
    <span class="t-meta" style="color:var(--blue-600);font-weight:600">Hiện tại</span>
  </div>

  <!-- Locked / skip-ahead -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;border-radius:9999px;background:var(--gray-100);color:var(--gray-400);display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <span class="t-meta" style="color:var(--fg-5)">Khoá / Nhảy cóc</span>
  </div>

  <div style="max-width:160px">
    <div class="t-meta" style="color:var(--fg-2);font-weight:600;margin-bottom:4px">Lesson node states</div>
    <div class="t-meta">3 states · 64px circle · the <code>animate-ping</code> ring is the heartbeat of the active node.</div>
  </div>
</div></body></html>
