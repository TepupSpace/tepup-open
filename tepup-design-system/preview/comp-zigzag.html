<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 22px;min-height:340px;justify-content:center;align-items:center;gap:0;flex-direction:row">
<style>
  .node{position:relative;width:60px;height:60px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
  .node-done{background:var(--green-500);color:#fff}
  .node-cur{background:#fff;border:4px solid var(--blue-500);box-shadow:var(--shadow-blue)}
  .node-cur::after{content:'';position:absolute;inset:-8px;border:2px solid var(--blue-400);border-radius:9999px;opacity:0.35}
  .node-cur .dot{width:14px;height:14px;border-radius:9999px;background:var(--blue-500)}
  .node-lock{background:var(--gray-100);color:var(--gray-400)}
  .step-label{font-size:11px;color:var(--fg-3);margin-top:6px;text-align:center}
  .step{display:flex;flex-direction:column;align-items:center}
</style>
<div style="display:flex;flex-direction:column;align-items:center;gap:24px">
  <div><div class="step"><div class="node node-done"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="step-label">Bài 1</div></div></div>
  <div style="transform:translateX(56px)"><div class="step"><div class="node node-done"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="step-label">Bài 2</div></div></div>
  <div style="transform:translateX(0)"><div class="step"><div class="node node-cur"><div class="dot"></div></div><div class="step-label" style="color:var(--blue-600);font-weight:600">Bài 3 · Hiện tại</div></div></div>
  <div style="transform:translateX(56px)"><div class="step"><div class="node node-lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="step-label" style="color:var(--fg-5)">Bài 4</div></div></div>
</div>
<div style="margin-left:24px;max-width:240px">
  <div class="t-meta" style="font-weight:600;color:var(--fg-2);margin-bottom:4px">Zigzag roadmap</div>
  <div class="t-meta">Các node xếp xen kẽ <code>x: 0 / +56</code>, không có nét nối. Node hiện tại nổi bật bằng viền xanh + ping halo. Tô màu theo nhân vật khi dùng trong story.</div>
</div>
</div></body></html>
