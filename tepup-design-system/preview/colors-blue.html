<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:22px 28px;min-height:160px;justify-content:center;gap:10px">
  <div class="row" style="gap:10px">
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-50)"></div><span class="sw-name">50</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-100)"></div><span class="sw-name">100</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-200)"></div><span class="sw-name">200</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-400)"></div><span class="sw-name">400</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,0.18)"></div><span class="sw-name" style="color:var(--blue-600)">500 · primary</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-600)"></div><span class="sw-name">600 · hover</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-700)"></div><span class="sw-name">700</span></div>
  </div>
  <span class="t-meta"><strong style="color:var(--fg-2)">Blue 500</strong> is the primary action color — CTAs, current-lesson ring, focus ring.</span>
</div></body></html>
