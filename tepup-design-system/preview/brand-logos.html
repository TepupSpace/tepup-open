<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:22px 28px;min-height:200px;justify-content:center;gap:20px;flex-direction:row;align-items:center">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:96px;height:96px;background:#fff;border:1px solid var(--border-2);border-radius:16px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/tepup-logo.png" width="80" height="80" alt="Tepup color">
    </div>
    <span class="t-caption" style="font-weight:600">Color · primary</span>
    <span class="t-caption" style="font-family:var(--font-mono)">tepup-logo.png</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:96px;height:96px;background:#fff;border:1px solid var(--border-2);border-radius:16px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/tepup-logo-alt.png" width="80" height="80" alt="Tepup framed">
    </div>
    <span class="t-caption" style="font-weight:600">Framed lockup</span>
    <span class="t-caption" style="font-family:var(--font-mono)">tepup-logo-alt.png</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:96px;height:96px;background:var(--gray-900);border-radius:16px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/tepup-logo-bw.png" width="80" height="80" style="filter:invert(1)" alt="Tepup mono">
    </div>
    <span class="t-caption" style="font-weight:600">Mono · on dark</span>
    <span class="t-caption" style="font-family:var(--font-mono)">tepup-logo-bw.png</span>
  </div>
  <div style="max-width:200px">
    <div class="t-meta" style="font-weight:600;color:var(--fg-2);margin-bottom:4px">A hand-drawn shrimp = a stylised "T"</div>
    <div class="t-meta">"Tép" = shrimp in Vietnamese. Red body, black sketch tail, single dot eye. The <em>only</em> hand-drawn element in the brand — don't extend the doodle aesthetic elsewhere.</div>
  </div>
</div></body></html>
