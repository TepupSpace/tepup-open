<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:22px 28px;min-height:200px;justify-content:center;gap:14px">
  <div class="row" style="gap:18px;align-items:flex-end">
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:6px"></div><span class="t-caption">md · 6px</span></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:8px"></div><span class="t-caption">lg · 8px</span></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:12px"></div><span class="t-caption">xl · 12px</span></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:2px solid var(--blue-500);border-radius:16px"></div><span class="t-caption" style="font-weight:600;color:var(--blue-600)">2xl · 16px · signature</span></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:24px"></div><span class="t-caption">3xl · 24px</span></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:9999px"></div><span class="t-caption">full · ∞</span></div>
  </div>
  <span class="t-meta"><strong style="color:var(--blue-600)">rounded-2xl (16px)</strong> is the soul of Tepup. When in doubt, that's the radius.</span>
</div></body></html>
