<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:22px 28px;min-height:200px;justify-content:center;gap:14px">
  <div class="row" style="gap:14px">
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--teal-500)"></div><span class="sw-name" style="color:var(--teal-600)">Minh (Student)</span><span class="sw-hex">teal-500/600</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-500)"></div><span class="sw-name" style="color:var(--blue-600)">Hương (Office)</span><span class="sw-hex">blue-500/600</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--orange-500)"></div><span class="sw-name" style="color:var(--orange-600)">Bác Tư (Vendor)</span><span class="sw-hex">orange-500/600</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--purple-500)"></div><span class="sw-name" style="color:var(--purple-600)">Gig-driver</span><span class="sw-hex">purple-500/600</span></div>
  </div>
  <div class="row" style="gap:10px;margin-top:2px">
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--teal-50)"></div><span class="sw-hex">teal-50</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--blue-50)"></div><span class="sw-hex">blue-50</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--orange-50)"></div><span class="sw-hex">orange-50</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--purple-50)"></div><span class="sw-hex">purple-50</span></div>
  </div>
  <span class="t-meta">Each character carries a dedicated accent. The <code>-50</code> tint is the matching icon-tile background.</span>
</div></body></html>
