<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:20px 22px;min-height:230px;justify-content:center;gap:12px;align-items:center">
  <div style="width:440px;max-width:100%">
    <label style="display:block;font-size:14px;font-weight:500;color:var(--fg-2);margin-bottom:6px">Tên tài khoản</label>
    <div style="position:relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input value="Tên tài khoản của bạn" style="width:100%;padding:13px 14px 13px 42px;border:1px solid var(--border-2);border-radius:12px;font-size:15px;color:var(--fg-3);outline:none;font-family:var(--font-sans)"/>
    </div>
  </div>
  <div style="width:440px;max-width:100%">
    <label style="display:block;font-size:14px;font-weight:500;color:var(--fg-2);margin-bottom:6px">Mật khẩu</label>
    <div style="position:relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" value="••••••••••" style="width:100%;padding:13px 48px 13px 42px;border:2px solid var(--blue-500);border-radius:12px;font-size:15px;color:var(--fg-1);outline:none;font-family:var(--font-sans);box-shadow:0 0 0 3px rgba(59,130,246,0.20)"/>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>
  <span class="t-meta" style="margin-top:2px">Inputs: 12px radius · grey-200 border · blue-500 + ring on focus · 20px Lucide leading icon.</span>
</div></body></html>
