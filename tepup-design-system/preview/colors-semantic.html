<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:22px 28px;min-height:160px;justify-content:center;gap:12px">
  <div class="row" style="gap:12px">
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--green-500)"></div><span class="sw-name" style="color:var(--green-700)">Success</span><span class="sw-hex">green-500 · completed, Hoàn thành</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--yellow-500)"></div><span class="sw-name" style="color:var(--yellow-800)">Warning</span><span class="sw-hex">yellow-500 · callouts</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--red-500)"></div><span class="sw-name" style="color:var(--red-700)">Danger</span><span class="sw-hex">red-500 · wrong answer</span></div>
    <div class="sw" style="flex:1"><div class="sw-chip" style="background:var(--orange-500)"></div><span class="sw-name" style="color:var(--orange-600)">Skip-ahead</span><span class="sw-hex">orange-500 · "Nhảy cóc"</span></div>
  </div>
  <span class="t-meta">Strict color jobs — never decorative. Pair with the matching Lucide glyph (Check / AlertCircle / X).</span>
</div></body></html>
