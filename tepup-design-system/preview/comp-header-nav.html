<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:0;min-height:160px;gap:0;justify-content:flex-start;background:var(--gray-50)">
  <header style="background:#fff;border-bottom:1px solid var(--border-1);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between">
    <a style="display:inline-flex;align-items:center;gap:10px;text-decoration:none">
      <img src="../assets/tepup-logo.png" width="32" height="32" style="border-radius:8px" alt="Tepup">
      <span style="font-weight:700;color:var(--fg-1);font-size:18px">Tepup</span>
    </a>
    <nav style="display:flex;gap:4px">
      <a style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--fg-1);font-weight:500;border-bottom:2px solid var(--fg-1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Trang chủ</a>
      <a style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--fg-3);border-radius:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Khóa học</a>
      <a style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;color:var(--fg-3);border-radius:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
        Thư viện</a>
    </nav>
    <button style="padding:8px;border-radius:8px;background:transparent;border:none;color:var(--fg-3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </header>
  <div style="padding:14px 24px 6px"><span class="t-meta">Header · 64px · <code>sticky top-0 z-50</code> · active item carries a 2px bottom underline in <code>fg-1</code>.</span></div>
</div></body></html>
