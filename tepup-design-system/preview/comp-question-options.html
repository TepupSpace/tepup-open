<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 22px;min-height:240px;justify-content:center;gap:8px;align-items:center">
  <style>.opt{width:480px;max-width:100%;padding:14px;border-radius:12px;border:2px solid var(--border-2);display:flex;gap:12px;align-items:center;font-size:15px;color:var(--fg-2)}
    .opt .dot{width:24px;height:24px;border-radius:9999px;border:2px solid var(--gray-300);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .opt-default {}
    .opt-selected{border-color:var(--blue-500);background:var(--blue-50);color:var(--blue-700);font-weight:500}
    .opt-selected .dot{border-color:var(--blue-500);background:var(--blue-500)}.opt-selected .dot::after{content:'';width:8px;height:8px;border-radius:9999px;background:#fff}
    .opt-correct{border-color:var(--green-500);background:var(--green-50);color:var(--green-700);font-weight:500}
    .opt-correct .dot{border-color:var(--green-500);background:var(--green-500)}
    .opt-wrong{border-color:var(--red-500);background:var(--red-50);color:var(--red-700)}
    .opt-wrong .dot{border-color:var(--red-500);background:var(--red-500)}
  </style>
  <div class="opt opt-default"><div class="dot"></div>Chủ nghĩa tư bản dựa trên sở hữu tập thể</div>
  <div class="opt opt-selected"><div class="dot"></div>Chủ nghĩa tư bản dựa trên sở hữu tư nhân</div>
  <div class="opt opt-correct"><div class="dot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>Cơ chế thị trường tự do điều tiết giá cả</div>
  <div class="opt opt-wrong"><div class="dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>Mọi tài sản đều thuộc về nhà nước</div>
</div></body></html>
