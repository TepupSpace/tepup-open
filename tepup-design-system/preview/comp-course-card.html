<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:20px;min-height:240px;justify-content:center;align-items:center;gap:0;background:var(--gray-50)">
  <div style="display:flex;gap:14px">
    <!-- a normal course card -->
    <div style="background:#fff;border:1px solid var(--border-2);border-radius:16px;padding:22px;width:160px;text-align:left">
      <div class="icon-tile" style="background:var(--blue-50);color:var(--blue-500);width:72px;height:72px;margin-bottom:14px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      </div>
      <div style="font-weight:600;color:var(--fg-1);font-size:15px;line-height:1.35">Nhập môn Kinh tế</div>
    </div>
    <!-- a NEW course card (with badge) -->
    <div style="position:relative;background:#fff;border:1px solid var(--border-2);border-radius:16px;padding:22px;width:160px;box-shadow:var(--shadow-lg);transform:translateY(-6px)">
      <div style="position:absolute;top:-8px;right:-8px;background:var(--green-500);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px">NEW</div>
      <div class="icon-tile" style="background:var(--blue-100);color:var(--blue-500);width:72px;height:72px;margin-bottom:14px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
      </div>
      <div style="font-weight:600;color:var(--blue-600);font-size:15px;line-height:1.35">Hệ thống Thuế VN</div>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;max-width:200px">
      <div class="t-meta" style="font-weight:600;color:var(--fg-2);margin-bottom:4px">Course card · hover</div>
      <div class="t-meta">Lifts <code>-translate-y-1</code> · gains <code>shadow-lg</code> · title shifts to <code>blue-600</code>. NEW badge pinned <code>-top-2 -right-2</code>.</div>
    </div>
  </div>
</div></body></html>
