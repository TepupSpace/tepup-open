<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .btn-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .btn .lucide { width:18px; height:18px; }
</style></head>
<body>
<div class="card" style="padding:24px 28px;min-height:220px;justify-content:center;gap:14px">
  <object data="_icons.svg" type="image/svg+xml" style="position:absolute;width:0;height:0"></object>
  <div class="btn-row">
    <button class="btn btn-primary">Bắt đầu học
      <svg class="lucide"><use href="_icons.svg#i-arrow-right"/></svg></button>
    <button class="btn btn-primary" style="font-size:18px;padding:14px 28px">Bắt đầu
      <svg class="lucide" style="width:20px;height:20px"><use href="_icons.svg#i-arrow-right"/></svg></button>
    <button class="btn btn-success">Hoàn thành</button>
    <button class="btn btn-skip">Nhảy cóc</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost">Tìm hiểu thêm</button>
    <button class="btn btn-outline" style="border-color:#a5f3fc">Tìm hiểu cách đóng góp
      <svg class="lucide"><use href="_icons.svg#i-arrow-right"/></svg></button>
    <button class="btn btn-disabled">Chọn đáp án</button>
    <button class="btn" style="background:var(--gray-900);color:#fff">Kiểm tra</button>
  </div>
  <span class="t-meta">Button corpus: <strong style="color:var(--fg-2)">primary blue</strong> · success · skip-ahead orange · ghost · cyan-outline (contributor) · disabled · dark "Kiểm tra".</span>
</div></body></html>
