<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:24px;min-height:200px;justify-content:center;gap:16px;align-items:stretch">
  <div style="display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--border-1);border-radius:16px;background:#fff">
    <button style="border:none;background:transparent;padding:6px;border-radius:8px;color:var(--fg-3)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div style="flex:1;height:8px;background:var(--gray-100);border-radius:9999px;overflow:hidden"><div style="height:100%;width:62%;background:var(--green-500);transition:all 500ms"></div></div>
  </div>
  <div style="display:flex;gap:16px">
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <span class="t-meta" style="font-weight:600;color:var(--fg-2)">Progress bar</span>
      <span class="t-meta">8px tall · <code>rounded-full</code> · <code>green-500</code> fill · <code>gray-100</code> track. The <code>X</code> close button sits inline-left.</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <span class="t-meta" style="font-weight:600;color:var(--fg-2)">Behaviour</span>
      <span class="t-meta"><code>aria-valuenow</code> + <code>role="progressbar"</code>. Width animates over 500ms when blocks reveal.</span>
    </div>
  </div>
</div></body></html>
