<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:22px 28px;min-height:240px;justify-content:center;gap:12px">
  <div class="row" style="gap:18px">
    <div style="flex:1">
      <div class="label" style="margin-bottom:8px">Text</div>
      <div style="color:var(--fg-1);font-weight:600;font-size:15px">fg-1 — primary</div>
      <div style="color:var(--fg-2);font-size:15px">fg-2 — body</div>
      <div style="color:var(--fg-3);font-size:15px">fg-3 — lead</div>
      <div style="color:var(--fg-4);font-size:15px">fg-4 — meta</div>
      <div style="color:var(--fg-5);font-size:15px">fg-5 — placeholder</div>
    </div>
    <div style="flex:1">
      <div class="label" style="margin-bottom:8px">Surfaces</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div style="background:var(--bg-app);border:1px solid var(--border-2);padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600">bg-app</div>
        <div style="background:var(--bg-muted);padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600">bg-muted</div>
        <div style="background:var(--bg-card);border:1px solid var(--border-1);padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600">bg-card</div>
        <div style="background:var(--gray-900);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600">dark band</div>
      </div>
    </div>
    <div style="flex:0 0 130px">
      <div class="label" style="margin-bottom:8px">Borders</div>
      <div style="border:1px solid var(--border-1);padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:4px">border-1</div>
      <div style="border:1px solid var(--border-2);padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:4px">border-2</div>
      <div style="border:1px solid var(--border-3);padding:6px 10px;border-radius:6px;font-size:12px">border-3 (hover)</div>
    </div>
  </div>
</div></body></html>
